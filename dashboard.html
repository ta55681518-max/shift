<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEMURI分析">
<title>KEMURI屋 売上・原価</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#f2f2f4;color:#1a1a1a;font-size:16px;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  }
  #app{max-width:560px;margin:0 auto;background:#fff;min-height:100%;
       padding-bottom:calc(92px + env(safe-area-inset-bottom));}
  button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;touch-action:manipulation;-webkit-user-select:text;user-select:text;}

  .header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ececec;
          padding:calc(12px + env(safe-area-inset-top)) 16px 10px;}
  .header h1{font-size:19px;font-weight:700;}
  .header .sub{font-size:12px;color:#999;font-weight:400;display:block;margin-top:2px;}
  .pad{padding:14px 16px 20px;}

  .btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;text-align:center;}
  .btn-primary{background:#e8531f;color:#fff;}
  .btn-dark{background:#222;color:#fff;}
  .btn-gray{background:#f1f1f3;color:#333;}
  .btn-out{background:#fff;border:1.5px solid #ddd;color:#333;}
  input[type=file]{display:none;}
  .file-btn{display:block;text-align:center;background:#e8531f;color:#fff;border-radius:14px;
            padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;
            touch-action:manipulation;margin-bottom:10px;}
  .btn-danger{background:#fff0ee;color:#d33;}
  .btn:disabled{background:#ededed;color:#aaa;}
  .btn-sm{width:auto;padding:11px 15px;font-size:15px;border-radius:12px;}
  .card{border:1.5px solid #ededed;border-radius:16px;padding:14px;margin-bottom:12px;}
  .card h2{font-size:15px;font-weight:700;margin-bottom:10px;}
  .muted{font-size:13px;color:#8a8a8a;line-height:1.6;}
  .gap{margin-top:10px;}
  .warn{background:#fff8e6;border:1.5px solid #ffe0a3;border-radius:14px;padding:12px 14px;font-size:14px;color:#8a6100;line-height:1.6;margin-bottom:10px;}
  .info{background:#f4f7ff;border:1.5px solid #d8e3ff;border-radius:14px;padding:12px 14px;font-size:14px;color:#3a4d8f;line-height:1.6;margin-bottom:10px;}
  .ok-box{background:#eafaf1;border:1.5px solid #b9ebd0;border-radius:14px;padding:12px 14px;font-size:14px;color:#0a7a44;line-height:1.6;margin-bottom:10px;}

  /* 数字カード */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .kpi{border:1.5px solid #ededed;border-radius:16px;padding:13px 14px;}
  .kpi .lab{font-size:12px;color:#999;font-weight:700;}
  .kpi .v{font-size:26px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.15;}
  .kpi .v small{font-size:14px;font-weight:700;color:#888;}
  .kpi .sub{font-size:11px;color:#aaa;margin-top:2px;}
  .kpi.hi{border-color:#ffc9bf;background:#fffaf9;}
  .kpi.hi .v{color:#d92d20;}

  /* 商品の行 */
  .prow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #f2f2f2;}
  .prow:last-child{border-bottom:none;}
  .prow .rk{font-size:12px;color:#bbb;font-weight:800;min-width:20px;}
  .prow .nm{flex:1;font-size:16px;font-weight:700;line-height:1.3;word-break:break-word;}
  .prow .nm small{display:block;font-size:11px;color:#aaa;font-weight:600;margin-top:2px;}
  .prow .q{font-size:19px;font-weight:800;min-width:46px;text-align:right;font-variant-numeric:tabular-nums;}
  .prow .m{font-size:12px;color:#999;min-width:66px;text-align:right;font-variant-numeric:tabular-nums;}
  .bar{display:block;height:6px;border-radius:999px;background:#f0f0f2;margin-top:6px;overflow:hidden;}
  .bar i{display:block;height:100%;background:#e8531f;border-radius:999px;}
  .chips button[disabled]{opacity:.35;}
  .rate{border-radius:999px;font-size:12px;font-weight:800;padding:4px 9px;min-width:52px;text-align:center;}
  .rate.lo{background:#eafaf1;color:#0a9d55;}
  .rate.mid{background:#fff6e0;color:#c07d00;}
  .rate.hi{background:#ffefec;color:#d92d20;}
  .rate.non{background:#f4f4f6;color:#bbb;}

  .sec{font-size:13px;color:#999;font-weight:700;margin:16px 4px 6px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chips button{border:1.5px solid #e2e2e2;background:#fff;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:700;color:#666;}
  .chips button.on{border-color:#e8531f;background:#fff4ef;color:#e8531f;}

  label.lab{display:block;font-size:13px;color:#888;font-weight:700;margin:12px 0 6px;}
  input.txt{width:100%;padding:13px;font-size:17px;border:1.5px solid #e2e2e2;border-radius:12px;background:#fff;}
  select.sel{width:100%;padding:13px;font-size:16px;border:1.5px solid #e2e2e2;border-radius:12px;background:#fff;}
  textarea{width:100%;min-height:130px;padding:12px;font-size:14px;border:1.5px solid #e2e2e2;border-radius:12px;background:#fff;}
  .two{display:flex;gap:10px;margin-top:10px;}
  .two .btn{flex:1;}

  /* 原価の行 */
  .crow{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #f2f2f2;}
  .crow .nm{flex:1;font-size:16px;font-weight:700;word-break:break-word;}
  .crow .nm small{display:block;font-size:11px;color:#aaa;font-weight:600;}
  .crow .p{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .crow .p.zero{color:#ccc;}
  .crow input{width:88px;padding:9px;font-size:16px;border:1.5px solid #e2e2e2;border-radius:10px;text-align:right;}
  .crow .u{width:58px;padding:9px;font-size:14px;border:1.5px solid #e2e2e2;border-radius:10px;}

  /* AIの結果 */
  .ai h3{font-size:14px;font-weight:800;color:#555;margin:14px 0 6px;}
  .ai ul{list-style:none;}
  .ai li{font-size:14px;line-height:1.7;padding:7px 0;border-bottom:1px solid #f4f4f6;}
  .ai li b{color:#e8531f;}
  .ai .lead{font-size:15px;line-height:1.8;background:#fafafb;border-radius:14px;padding:13px;}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
          border-top:1px solid #ececec;display:flex;max-width:560px;margin:0 auto;
          padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);}
  .tabbar button{flex:1;border:none;background:none;padding:9px 0 8px;font-size:11px;font-weight:700;color:#aaa;}
  .tabbar button .ic{display:block;font-size:21px;line-height:1.25;}
  .tabbar button.on{color:#e8531f;}

  .toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:#222;color:#fff;padding:13px 20px;border-radius:24px;font-size:15px;font-weight:700;
         opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90%;text-align:center;}
  .toast.show{opacity:.96;}
  .spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);
        border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1 id="h-title">売上・原価</h1>
    <span class="sub" id="h-sub">串焼KEMURI屋</span>
  </div>
  <div id="view"></div>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="toast" id="toast"></div>

<input type="file" id="dailyfile" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain,application/csv,application/vnd.ms-excel" onchange="onPickDaily(this)">

<script src="kemuri-core.js"></script>
<script src="pos-source.js"></script>
<script src="kemuri-data.js"></script>

<script>
"use strict";
/* ============================================================
   串焼KEMURI屋 売上・原価ダッシュボード
   ・数字は kemuri-data.js（ふつうのJS）が計算する
   ・AIは「計算済みの数字を見て日本語で書く」だけ
     → APIが落ちていても数字は出る
   ・OpenAIのキーはサーバー側（/api/ai）にしか無い
   ============================================================ */
const PASS_KEY  = 'kemuri_ai_pass';      // 合言葉（この端末だけ）
const CACHE_KEY = 'kemuri_ai_cache_v1';  // AIの返事の控え（同じ内容で二度呼ばない）

const num = KemuriCore.num;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Math.round(num(n)).toLocaleString('ja-JP');

let TAB = 'sum';
let RANGE = 'all';                      // all | 7 | 30 | month
let A = null;                           // 直近の分析結果
let AI = { loading:false, error:'', result:null, at:'' };
let IMP = { loading:false, rows:null, error:'' };   // 単価取込の途中経過

/* ---------- 小道具 ---------- */
/* エラーの箱。AIの生の返事があれば、折りたたんで添える */
function errBox(msg, raw){
  let h = '<div class="warn gap">' + esc(msg);
  if(raw){
    h += '<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">AIが返した内容を見る</summary>'
       + '<div style="margin-top:6px;font-size:12px;background:#fff;border-radius:8px;padding:8px;'
       + 'white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto">' + esc(raw) + '</div></details>';
  }
  return h + '</div>';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function todayStr(){ return KemuriCore.todayStr(); }
function rangeDates(){
  const t = todayStr();
  if(RANGE === '7')     return { from: KemuriCore.addDays(t, -6), to: t };
  if(RANGE === '30')    return { from: KemuriCore.addDays(t, -29), to: t };
  if(RANGE === 'month') return { from: t.slice(0,7) + '-01', to: t };
  return { from:'', to:'' };
}
function rangeLabel(){
  return RANGE === '7' ? '直近7日' : RANGE === '30' ? '直近30日' : RANGE === 'month' ? '今月' : 'ぜんぶ';
}
function refresh(){ const r = rangeDates(); A = KemuriData.analyze(r); }

/* ---------- AIの窓口 ---------- */
function aiPass(){ try{ return localStorage.getItem(PASS_KEY) || ''; }catch(e){ return ''; } }
function userErr(msg){ const e = new Error(msg); e.userMsg = msg; return e; }

async function callAI(task, payload){
  const pass = aiPass();
  if(!pass) throw userErr('先に「設定」タブで合言葉を入れてください');
  let res;
  try{
    res = await fetch('/api/ai', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Kemuri-Pass': pass },
      body: JSON.stringify({ task, payload }),
    });
  }catch(e){ throw userErr('サーバーに繋がりませんでした。通信を確認してください'); }

  let j = null;
  try{ j = await res.json(); }catch(e){}
  if(!res.ok || !j || j.error){
    let m = (j && j.error) || ('エラー（' + res.status + '）');
    if(res.status === 404) m = 'AIの窓口が見つかりません。Netlifyにデプロイされているか確認してください';
    /* AIが何を返したのか分かるように、先頭だけ添える。
       これが無いと「期待した形ではありません」だけで手がかりが無くなる */
    const e = userErr(m);
    if(j && j.raw) e.raw = String(j.raw);
    throw e;
  }
  return j;
}

/* AIの返事の控え。同じ期間・同じ数字なら呼び直さない */
function cacheKey(){
  if(!A) return '';
  return [RANGE, A.period.from, A.period.to, A.totals.qty, A.totals.amount, A.products.length].join('|');
}
function readCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    return c[cacheKey()] || null;
  }catch(e){ return null; }
}
function writeCache(obj){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    c[cacheKey()] = obj;
    const keys = Object.keys(c);
    if(keys.length > 12) keys.slice(0, keys.length - 12).forEach(k => delete c[k]);
    localStorage.setItem(CACHE_KEY, JSON.stringify(c));
  }catch(e){}
}

async function runAnalyze(force){
  if(AI.loading) return;
  if(!A || !A.products.length){ toast('まだ売上データがありません'); return; }
  if(!force){
    const c = readCache();
    if(c){ AI = { loading:false, error:'', result:c.result, at:c.at }; render(); return; }
  }
  AI = { loading:true, error:'', result:null, at:'' };
  render();
  try{
    const r = await callAI('analyze', { data: KemuriData.forAI(A) });
    AI = { loading:false, error:'', result:r.result, at:new Date().toISOString() };
    writeCache({ result:r.result, at:AI.at });
  }catch(e){
    AI = { loading:false, error:(e && e.userMsg) || 'うまくいきませんでした', result:null, at:'', raw:(e && e.raw) || '' };
  }
  render();
}

/* ============================================================
   ① サマリ
   ============================================================ */
/* 日別売上CSV（日付・天気・総売上・客数）の取り込み状態 */
let DIMP = { open:false, text:'', res:null, err:'' };
let DOW_PICK = null;            // 曜日別の目安で見ている曜日（null=明日）
const DOW_NAME = ['日','月','火','水','木','金','土'];

/* ---- 日別売上CSVの取り込み ---- */
function dailyCard(dst){
  let h = '<div class="card"><h2>日別の売上（POSの日別集計）</h2>';
  if(dst.days){
    h += '<div class="muted">' + dst.days + '日ぶん（' + esc(dst.from) + ' 〜 ' + esc(dst.to) + '）'
       + '／1日あたり ' + yen(dst.avgGross) + '・' + dst.avgGuests + '人</div>';
  }else{
    h += '<div class="muted">POSの「日別」集計CSVを入れると、<b>曜日ごとの忙しさ</b>が出せます。'
       + '商品名は入っていなくて大丈夫です。在庫は動きません。</div>';
  }
  h += '<button class="btn btn-out gap" onclick="DIMP.open=!DIMP.open;render()">'
     + (DIMP.open ? '閉じる' : (dst.days ? '追加で取り込む' : '日別売上CSVを取り込む')) + '</button>';

  if(DIMP.open){
    h += '<label class="file-btn gap" for="dailyfile">📄 CSVファイルから取り込む</label>'
       + '<div class="muted" style="margin-bottom:12px">POSから書き出した日別売上のCSVを選んでください。'
       + '文字コード（Shift_JIS／UTF-8）は自動で判定します。'
       + '<br>iPhoneでファイルが選べないときは、CSVを一度「ファイル」アプリに保存してから選んでください。</div>'
       + '<div class="muted" style="font-weight:700;margin-bottom:6px">うまくいかないときは貼り付け</div>'
       + '<textarea class="gap" id="dcsv" placeholder="日付,天気,総売上(税抜),総売上(税込),客計,客単価,組計,組単価&#10;01月05日(月),,93897,103220,13,7940,12,8602">'
       + esc(DIMP.text) + '</textarea>'
       + '<button class="btn btn-dark gap" onclick="readDailyCsv()">貼り付けた内容を読み取る</button>';
    if(DIMP.err) h += '<div class="warn gap">' + esc(DIMP.err) + '</div>';
    const r = DIMP.res;
    if(r && r.rows && r.rows.length){
      h += '<div class="ok-box gap">' + r.rows.length + '日ぶん読み取りました（' + esc(r.from) + ' 〜 ' + esc(r.to) + '）。</div>';
      if(r.yearGuessed){
        const allOk = r.matched === r.checked;
        h += '<div class="' + (allOk ? 'info' : 'warn') + ' gap">CSVに年が書かれていないので、'
           + 'かっこの曜日から <b>' + esc(r.year) + '年</b> と判断しました'
           + '（' + r.matched + '/' + r.checked + '日ぶんの曜日が一致）。'
           + (allOk ? '' : '<br>一致しない日があります。年が違うかもしれないので、取り込む前に確かめてください。')
           + '</div>';
      }
      h += '<button class="btn btn-primary gap" onclick="saveDailyCsv()">' + r.rows.length + '日ぶんを登録する</button>';
    }
  }
  return h + '</div>';
}
/* ファイルから読む。文字コードの判定は取込層（pos-source.js）に任せる */
async function onPickDaily(el){
  const f = el.files && el.files[0]; el.value = '';
  if(!f) return;
  DIMP.open = true; DIMP.err = ''; DIMP.res = null;
  let text = '';
  try{ text = await KemuriPos.decodeFile(f); }
  catch(e){ DIMP.err = 'ファイルを読めませんでした。'; render(); return; }
  if(text.slice(0,2) === 'PK'){
    DIMP.err = 'エクセル形式（.xlsx）は取り込めません。POSからCSVで書き出してください。';
    render(); return;
  }
  DIMP.text = text;
  render();                      // 先に枠へ入れて、何を読んだか見えるようにする
  readDailyCsv(text);
}
function readDailyCsv(fromFile){
  if(typeof fromFile === 'string'){
    DIMP.text = fromFile;
  }else{
    const el = document.getElementById('dcsv');
    DIMP.text = el ? el.value : '';
  }
  DIMP.err = ''; DIMP.res = null;
  if(!DIMP.text.trim()){ DIMP.err = 'CSVを貼り付けてください。'; render(); return; }
  let r;
  try{ r = KemuriData.dailyFromCsv(DIMP.text); }
  catch(e){ DIMP.err = '読み取れませんでした。'; render(); return; }
  if(!r.headerFound){
    DIMP.err = '日別の売上表として読めませんでした。「日付」と「総売上」または「客計」の列があるCSVを入れてください。'
             + '（商品名と出数が並んでいるCSVは、こちらではなく冷凍在庫アプリのPOSタブで取り込みます）';
  }else if(!r.rows.length){
    DIMP.err = '日付の行が見つかりませんでした。';
  }else{
    DIMP.res = r;
  }
  render();
}
function saveDailyCsv(){
  const r = DIMP.res;
  if(!r || !r.rows || !r.rows.length) return;
  const res = KemuriData.daily.importRows(r.rows);
  DIMP = { open:false, text:'', res:null, err:'' };
  refresh(); render();
  toast(res.added + '日ぶんを登録しました' + (res.updated ? '（' + res.updated + '日ぶんは上書き）' : ''));
}

/* ---- 曜日ごとの忙しさ ---- */
function dowCard(dst){
  if(!dst.days) return '';
  const d = KemuriData.daily.dow();
  const rows = d.rows.filter(r => r.days);
  if(!rows.length) return '';
  const max = Math.max.apply(null, rows.map(r => r.avgGross));
  let h = '<div class="sec">曜日ごとの忙しさ</div><div class="card">'
        + '<div class="muted" style="margin-bottom:10px">' + d.days + '日ぶんの平均。'
        + '売上0の日は休みとみなして外しています。</div>';
  d.rows.forEach(r => {
    if(!r.days){
      h += '<div class="prow"><span class="nm">' + r.name + '<small>データなし'
         + (r.closed ? '（休み ' + r.closed + '日）' : '') + '</small></span>'
         + '<span class="rate non">—</span></div>';
      return;
    }
    const w = max ? Math.round(r.avgGross / max * 100) : 0;
    h += '<div class="prow"><span class="nm">' + r.name
       + '<small>' + r.days + '日ぶん・' + r.avgGuests + '人'
       + (r.closed ? '・休み' + r.closed + '日' : '') + '</small>'
       + '<span class="bar"><i style="width:' + w + '%"></i></span></span>'
       + '<span class="m">' + yen(r.avgGross) + '</span>'
       + '<span class="rate ' + (r.index >= 1.2 ? 'hi' : r.index >= 0.9 ? 'mid' : 'lo') + '">'
       + r.index.toFixed(2) + '</span></div>';
  });
  h += '<div class="muted gap">右の数字は「ふだんの日を1.00」としたときの忙しさです。</div></div>';
  return h;
}

/* ---- 翌日の目安（曜日の指数 × 1日あたりの出数） ---- */
function tomorrowCard(dst){
  if(!dst.days) return '';
  const d = KemuriData.daily.dow();
  const tmr = KemuriCore.nextDay(KemuriCore.todayStr());
  const pick = (DOW_PICK == null) ? KemuriCore.dowOf(tmr) : DOW_PICK;
  const row = d.rows[pick];
  let h = '<div class="sec">曜日別の目安</div><div class="card">'
        + '<div class="chips" style="margin-bottom:12px">'

function kpi(lab, v, sub, hi){
  return '<div class="kpi' + (hi?' hi':'') + '"><div class="lab">' + esc(lab) + '</div>'
       + '<div class="v">' + v + '</div><div class="sub">' + esc(sub||'') + '</div></div>';
}
function prow(p, rank){
  const r = p.costRate;
  const cls = r == null ? 'non' : r >= 40 ? 'hi' : r >= 30 ? 'mid' : 'lo';
  return '<div class="prow">'
    + (rank ? '<span class="rk">' + rank + '</span>' : '')
    + '<span class="nm">' + esc(p.name)
    + '<small>' + yen(p.unitPrice) + ' ／ 1日 ' + p.perDay + '</small></span>'
    + '<span class="q">' + p.qty + '</span>'
    + '<span class="m">' + yen(p.amount) + '</span>'
    + '<span class="rate ' + cls + '">' + (r == null ? '—' : r + '%') + '</span>'
    + '</div>';
}
function viewAI(){
  if(AI.loading) return '<button class="btn btn-dark" disabled><span class="spin"></span>AIが考えています…</button>';
  if(AI.error) return errBox(AI.error, AI.raw)
      + '<button class="btn btn-out" onclick="runAnalyze(true)">もう一度ためす</button>';
  if(!AI.result) return '<div class="muted" style="margin-bottom:10px">'
      + '計算した数字をAIに見てもらい、気づいた点を日本語で出します。'
      + '1回あたり1〜3円ほどです（同じ内容なら呼び直しません）。</div>'
      + '<button class="btn btn-dark" onclick="runAnalyze()">AIに見てもらう</button>';

  const r = AI.result;
  let h = '<div class="card ai">';
  if(r.summary) h += '<div class="lead">' + esc(r.summary) + '</div>';
  h += list('伸びている・よく出ている', r.good);
  h += list('落ちている・出ていない', r.bad);
  h += list('原価で気になるところ', r.cost);
  h += list('欠品しそう', r.risk);
  if(Array.isArray(r.todo) && r.todo.length){
    h += '<h3>明日やるとよいこと</h3><ul>'
       + r.todo.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  }
  if(Array.isArray(r.caution) && r.caution.length){
    h += '<h3>データ上の注意</h3><ul>'
       + r.caution.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  }
  h += '</div>';
  h += '<div class="muted" style="text-align:center;margin-bottom:8px">' + fmtAt(AI.at) + ' 時点</div>';
  h += '<button class="btn btn-out" onclick="runAnalyze(true)">もう一度AIに聞く</button>';
  return h;
}
function list(title, arr){
  if(!Array.isArray(arr) || !arr.length) return '';
  return '<h3>' + esc(title) + '</h3><ul>'
    + arr.map(x => '<li><b>' + esc(x.name || '') + '</b>　' + esc(x.why || '') + '</li>').join('')
    + '</ul>';
}
function fmtAt(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const z = n => ('0'+n).slice(-2);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function setRange(r){ RANGE = r; AI = { loading:false, error:'', result:null, at:'' }; refresh();
  const c = readCache(); if(c) AI = { loading:false, error:'', result:c.result, at:c.at };
  render(); }

/* ---- CSVの取り込み（AIを使わない） ---- */
let CIMP = { rows:null, skipped:null, error:'' };
let EDIT_C = { name:'' };

function readCostCsv(){
  const el = document.getElementById('csv-in');
  const text = el ? el.value.trim() : '';
  if(!text){ toast('先にCSVを貼り付けてください'); return; }
  const r = KemuriData.costsFromCsv(text);
  if(!r.headerFound){
    CIMP = { rows:null, skipped:null,
      error:'見出し行が見つかりませんでした。1行目に product_name と cost_yen（または「商品名」「原価」）を含む行が必要です' };
  }else if(!r.rows.length){
    CIMP = { rows:null, skipped:r.skipped, error:'読み取れる行がありませんでした' };
  }else{
    CIMP = { rows:r.rows, skipped:r.skipped, error:'' };
  }
  render();
}
function saveCostCsv(){
  if(!CIMP.rows || !CIMP.rows.length) return;
  const r = KemuriData.costs.importRows(CIMP.rows);
  CIMP = { rows:null, skipped:null, error:'' };
  refresh(); render();
  toast('新規 ' + r.added + '件 ／ 更新 ' + r.updated + '件を登録しました');
}
function editCost(name){ EDIT_C = { name }; render();
  setTimeout(() => { const el = document.getElementById('e-price'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 30); }
function saveEditCost(){
  const g = id => (document.getElementById(id)||{}).value;
  KemuriData.costs.set(EDIT_C.name, {
    price: num(g('e-price')),
    sale: g('e-sale') === '' ? null : num(g('e-sale')),
    unit: g('e-unit'), status: g('e-status'),
  });
  EDIT_C = { name:'' };
  refresh(); render(); toast('保存しました');
}

function impSet(i,k,v){ IMP.rows[i][k] = k === 'price' ? num(v) : v; }
function impDel(i){ IMP.rows.splice(i,1); render(); }
async function importCosts(){
  const el = document.getElementById('cost-in');
  const text = el ? el.value.trim() : '';
  if(!text){ toast('先に単価を貼り付けてください'); return; }
  IMP = { loading:true, rows:null, error:'' }; render();
  try{
    const r = await callAI('costs', { text });
    const rows = (r.result && r.result.rows) || [];
    if(!rows.length){
      IMP = { loading:false, rows:null, error:'単価を読み取れませんでした。商品名と値段が並んだ形で貼ってみてください' };
    }else{
      IMP = { loading:false, rows: rows, error:'' };
    }
  }catch(e){
    IMP = { loading:false, rows:null, error:(e && e.userMsg) || 'うまくいきませんでした', raw:(e && e.raw) || '' };
  }
  render();
}
function saveCosts(){
  if(!IMP.rows || !IMP.rows.length) return;
  const r = KemuriData.costs.importRows(IMP.rows);
  IMP = { loading:false, rows:null, error:'' };
  refresh(); render();
  toast('新規 ' + r.added + '件 ／ 更新 ' + r.updated + '件を保存しました');
}
function delCost(name){
  if(!confirm('「' + name + '」を原価マスタから削除しますか？')) return;
  KemuriData.costs.remove(name);
  EDIT_C = { name:'' };
  refresh(); render(); toast('削除しました');
}

  h += '<div class="card"><h2>ChatGPTのレシピを取り込む</h2>'
     + '<div class="muted">ChatGPTに書いてもらったレシピや、手書きの材料メモを貼り付けてください。'
     + '「1皿あたり何をいくつ使うか」をAIが取り出します。作り方の手順文が混ざっていても大丈夫です。</div>'
     + '<textarea id="rec-in" class="gap" placeholder="例）&#10;シーザーサラダ&#10;・レタス 80g&#10;・燻製ベーコン 1枚&#10;・粉チーズ 5g&#10;&#10;鶏皮ギョウザ（5個）&#10;・鶏皮餃子 5個"></textarea>';
  if(RIMP.loading){
    h += '<button class="btn btn-dark gap" disabled><span class="spin"></span>AIが読み取っています…</button>';
  }else{
    h += '<button class="btn btn-dark gap" onclick="importRecipes()">AIで読み取る</button>';
  }
  if(RIMP.error) h += errBox(RIMP.error, RIMP.raw);
  h += '</div>';

  /* 読み取り結果の確認 */
  if(RIMP.rows){
    h += '<div class="card"><h2>読み取った内容（' + RIMP.rows.length + '件）</h2>'
       + '<div class="muted">材料名が在庫や単価の名前と合っているか確認してください。'
       + '名前がずれていると原価が出ません。「？」はAIが自信を持てなかったものです。</div><div class="gap">';
    RIMP.rows.forEach((r,i) => {
      h += '<div class="card" style="margin-bottom:10px;border-color:#ffe0a3;background:#fffdf6">'
         + '<div class="crow" style="border:none;padding-bottom:4px">'
         + '<span class="nm">' + esc(r.name) + (r.sure === false ? ' <b style="color:#c07d00">？</b>' : '') + '</span>'
         + '<button class="btn btn-danger btn-sm" style="padding:8px 10px" onclick="rimpDel(' + i + ')">除</button></div>';
      (r.parts||[]).forEach((p,j) => {
        const price = KemuriData.costs.priceOf(p.name);
        h += '<div class="crow">'
           + '<input class="txt" style="flex:1;padding:9px;font-size:15px" value="' + esc(p.name) + '" onchange="rimpSet(' + i + ',' + j + ',\'name\',this.value)">'
           + '<input type="number" inputmode="decimal" style="width:70px" value="' + num(p.qty) + '" onchange="rimpSet(' + i + ',' + j + ',\'qty\',this.value)">'
           + '<input class="u" value="' + esc(p.unit||'') + '" onchange="rimpSet(' + i + ',' + j + ',\'unit\',this.value)" placeholder="単位">'
           + '</div>'
           + '<div class="muted" style="margin:-4px 0 6px 2px">'
           + (price > 0 ? '単価あり（' + yen(price) + (KemuriData.costs.get(p.name).unit ? ' / ' + esc(KemuriData.costs.get(p.name).unit) : '') + '）'
                        : '⚠️ この名前の単価がまだありません')
           + '</div>';
      });
      h += '</div>';
    });
    h += '</div><div class="two">'
       + '<button class="btn btn-gray" onclick="RIMP.rows=null;render()">やめる</button>'
       + '<button class="btn btn-primary" onclick="saveRecipes()">この内容で保存</button>'
       + '</div></div>';
  }

  if(rows.length){
    h += '<div class="card">';
    rows.forEach(r => {
      const c = KemuriData.recipes.costOf(r.name);
      h += '<div class="prow"><span class="nm">' + esc(r.name)
         + '<small>' + r.parts.map(p => esc(p.name) + ' ' + p.qty + esc(p.unit||'')).join('、') + '</small></span>'
         + '<span class="m">' + (c.mismatch ? '⚠️ 単位ずれ' : c.known ? yen(c.cost) : '単価未入力') + '</span>'
         + '<button class="btn btn-out btn-sm" style="padding:8px 11px" onclick="editRecipe(\''
         + esc(r.name).replace(/'/g,"\\'") + '\')">直す</button></div>';
      if(c.mismatch){
        const bad = c.parts.filter(p => p.mismatch)
          .map(p => esc(p.name) + '（レシピ ' + p.unit + ' ／ 単価 ' + p.costUnit + '）').join('、');
        h += '<div class="warn" style="margin:-2px 0 10px">単位が噛み合っていません：' + bad
           + '<br>どちらかの単位をそろえてください。このままだと原価がおかしな金額になります。</div>';
      }
    });
    h += '</div>';
  }

  h += '<div class="card gap"><h2>手で作る・直す</h2>'
     + '<label class="lab">メニュー名（POSの商品名）</label>'
     + '<input class="txt" id="r-name" value="' + esc(EDIT_R.name) + '" placeholder="例）シーザーサラダ">'
     + '<label class="lab">材料（1行に「材料名 数量 単位」。単位は省略可）</label>'
     + '<textarea id="r-parts" placeholder="例）&#10;燻製ベーコン 1 枚&#10;レタス 80 g">' + esc(EDIT_R.parts) + '</textarea>'
     + '<div class="two"><button class="btn btn-gray" onclick="clearRecipe()">クリア</button>'
     + '<button class="btn btn-primary" onclick="saveRecipe()">保存</button></div></div>';

  h += '</div>';
  return h;
}
let EDIT_R = { name:'', parts:'' };
let RIMP = { loading:false, rows:null, error:'' };

function rimpSet(i,j,k,v){ RIMP.rows[i].parts[j][k] = k === 'qty' ? num(v) : v;
  if(k !== 'qty') setTimeout(render, 0); }
function rimpDel(i){ RIMP.rows.splice(i,1); if(!RIMP.rows.length) RIMP.rows = null; render(); }

async function importRecipes(){
  const el = document.getElementById('rec-in');
  const text = el ? el.value.trim() : '';
  if(!text){ toast('先にレシピを貼り付けてください'); return; }
  RIMP = { loading:true, rows:null, error:'' }; render();
  try{
    /* 在庫と単価にある名前を渡して、材料名をできるだけ合わせてもらう */
    const materials = [
      ...KemuriData.stock.items().map(i => i.name),
      ...KemuriData.costs.all().map(c => c.name),
    ].filter((v,i,a) => v && a.indexOf(v) === i);
    const r = await callAI('recipes', { text, materials });
    const rows = (r.result && r.result.recipes) || [];
    if(!rows.length){
      RIMP = { loading:false, rows:null, error:'レシピを読み取れませんでした。メニュー名と材料・分量が並んだ形で貼ってみてください' };
    }else{
      RIMP = { loading:false, rows: rows, error:'' };
    }
  }catch(e){
    RIMP = { loading:false, rows:null, error:(e && e.userMsg) || 'うまくいきませんでした', raw:(e && e.raw) || '' };
  }
  render();
}
function saveRecipes(){
  if(!RIMP.rows || !RIMP.rows.length) return;
  const r = KemuriData.recipes.importRows(RIMP.rows);
  RIMP = { loading:false, rows:null, error:'' };
  refresh(); render();
  toast('新規 ' + r.added + '件 ／ 更新 ' + r.updated + '件を保存しました');
}

function seedRecipes(){
  const n = KemuriData.recipes.seedFromStock();
  refresh(); render();
  toast(n > 0 ? n + '件のレシピを作りました' : '新しく作れるものはありませんでした');
}
function editRecipe(name){
  const r = KemuriData.recipes.get(name);
  if(!r) return;
  EDIT_R = { name: r.name, parts: r.parts.map(p => p.name + ' ' + p.qty + (p.unit ? ' ' + p.unit : '')).join('\n') };
  render();
  const el = document.getElementById('r-name'); if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}
function clearRecipe(){ EDIT_R = { name:'', parts:'' }; render(); }
function saveRecipe(){
  const name = ((document.getElementById('r-name')||{}).value || '').trim();
  const txt  = (document.getElementById('r-parts')||{}).value || '';
  if(!name){ toast('メニュー名を入れてください'); return; }
  /* 「材料名 数量 単位」または「材料名 数量」。単位が数量にくっついていてもよい（80g） */
  const parts = txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)[\s　]+([\d.]+)[\s　]*([^\s　\d.]*)$/);
    return m ? { name:m[1].trim(), qty:num(m[2]), unit:(m[3]||'').trim() } : { name:l, qty:1, unit:'' };
  });
  if(!parts.length){ toast('材料を1つ以上入れてください'); return; }
  KemuriData.recipes.set(name, parts);
  EDIT_R = { name:'', parts:'' };
  refresh(); render(); toast('保存しました');
}

/* ============================================================
   ④ 設定
   ============================================================ */
let PING = { loading:false, msg:'', ok:false };
function viewSet(){
  const st = KemuriCore.sales.stats();
  const ug = KemuriCore.sales.usage();
  const ug2 = KemuriData.daily.stats();
  const cs = KemuriData.costs.stats();
  let h = '<div class="pad">';

  h += '<div class="card"><h2>AIの合言葉</h2>'
     + '<div class="muted">このサイトは誰でも開けるURLなので、AIを呼ぶには合言葉が要ります。'
     + 'Netlifyの環境変数 <b>KEMURI_PASS</b> と同じものを、ここに1回だけ入れてください。'
     + 'この端末に保存され、他の人には見えません。</div>'
     + '<input class="txt gap" id="pass" type="password" value="' + esc(aiPass()) + '" placeholder="合言葉">'
     + '<div class="two"><button class="btn btn-gray" onclick="savePass()">保存</button>'
     + '<button class="btn btn-dark" ' + (PING.loading?'disabled':'') + ' onclick="testAI()">'
     + (PING.loading ? '<span class="spin"></span>確認中…' : 'つながるか試す') + '</button></div>';
  if(PING.msg) h += (PING.ok ? '<div class="ok-box gap">' : '<div class="warn gap">') + esc(PING.msg) + '</div>';
  h += '</div>';

  h += '<div class="card"><h2>たまっているデータ</h2>'
     + row2('売上の履歴', st.days ? st.days + '日ぶん（' + st.items + '商品・' + num(st.qty).toLocaleString('ja-JP') + '点）' : 'まだありません')
     + (st.days ? row2('期間', st.from + ' 〜 ' + st.to) : '')
     + (st.lumpedDays ? row2('うち「まとめて入っている」日', st.lumpedDays + '日') : '')
     + row2('日別で入っている日', st.dailyDays + '日')
     + row2('仕入単価', cs.filled + ' / ' + cs.total + ' 件')
     + row2('レシピ', KemuriData.recipes.all().length + ' 件')
     + row2('この端末の使用量', Math.round(ug.bytes/1024).toLocaleString('ja-JP') + ' KB')
     + '</div>';

  /* 自動整理のしくみ。黙って古い日が消えると「入れたのに無い」になるので説明する */
  h += '<div class="card"><h2>売上履歴の自動整理</h2>'
     + '<div class="muted">スマホに保存できる量には限りがあるので、古いものから自動で整理しています。'
     + '取り込む操作はいつもどおりで大丈夫です。</div>'
     + row2('残す期間', '最新から ' + ug.keepDays + '日ぶん')
     + row2('明細をそのまま持つ期間', '最新から ' + ug.ticketDays + '日ぶん')
     + (ug.closed ? row2('印をまとめ済み', ug.closed + '日ぶん') : '')
     + '<div class="muted gap">' + ug.ticketDays + '日より古い日は、伝票1行ずつの控えを'
     + '「この日は取込済み」の印1つにまとめます。<b>売れた数はそのまま残る</b>ので、'
     + '予測や売れ筋には影響しません。同じCSVを入れ直しても二重に足されません。</div>'
     + '</div>';

  if(ug.full){
    h += '<div class="warn">この端末の空きが少なくなっています（' + Math.round(ug.bytes/1024).toLocaleString('ja-JP') + 'KB）。'
       + 'これ以上増えると、古い日から自動で捨てられます。</div>';
  }

  if(st.lumpedDays && !st.dailyDays){
    h += '<div class="warn">いまの売上データは、期間をまとめて取り込んだものだけです。'
       + '曜日ごとの傾向や翌日の予測を出すには、POSから<b>日別</b>で書き出して取り込む必要があります。</div>';
  }

  /* 取り違えて取り込んだときに、確実に元に戻せる手段。
     取込履歴からの取消が効かない場合の逃げ道でもある。
     消したあとはCSVを入れ直せばいいだけなので、消せないより消せるほうがよい。 */
  h += '<div class="card"><h2>入れ直したいとき</h2>'
     + '<div class="muted">取り違えて取り込んでしまったときは、ここで消してからCSVを入れ直してください。'
     + '<b>在庫の数は変わりません。</b>仕入単価とレシピも消えません。</div>';
  if(st.days){
    h += '<button class="btn btn-out gap" onclick="wipeSales()">商品ごとの売上を消す（'
       + st.days + '日ぶん）</button>';
  }
  if(ug2.days){
    h += '<button class="btn btn-out gap" onclick="wipeDaily()">日別の売上を消す（'
       + ug2.days + '日ぶん）</button>';
  }
  if(!st.days && !ug2.days) h += '<div class="muted gap">いま消せる売上はありません。</div>';
  h += '</div>';

  h += '<div class="card"><h2>ほかのアプリ</h2>'
     + '<a class="btn btn-out" style="text-decoration:none;display:block;margin-bottom:8px" href="reitou.html">冷凍在庫</a>'
     + '<a class="btn btn-out" style="text-decoration:none;display:block;margin-bottom:8px" href="kushiyaki.html">串焼き在庫</a>'
     + '<a class="btn btn-out" style="text-decoration:none;display:block" href="hacchu.html">発注</a>'
     + '</div>';

  h += '<div class="muted" style="text-align:center;padding:10px 0 4px">串焼KEMURI屋 売上・原価 v1</div>';
  h += '</div>';
  return h;
}
function row2(k,v){
  return '<div class="crow"><span class="nm">' + esc(k) + '</span>'
       + '<span class="muted" style="font-size:14px">' + esc(v) + '</span></div>';
}
/* 消すのは取り返しがつかないので、何が消えて何が残るかを書いて2回たしかめる */
function wipeSales(){
  const st = KemuriCore.sales.stats();
  if(!confirm('商品ごとの売上 ' + st.days + '日ぶん（' + st.from + '〜' + st.to + '）を消します。\n\n'
            + '・在庫の数は変わりません\n・仕入単価とレシピも残ります\n・CSVを入れ直せば戻せます\n\n消しますか？')) return;
  if(!confirm('本当に消しますか？\nこの操作は元に戻せません。')) return;
  try{ KemuriCore.sales.clear(); }catch(e){}
  refresh(); render(); toast('商品ごとの売上を消しました');
}
function wipeDaily(){
  const d = KemuriData.daily.stats();
  if(!confirm('日別の売上 ' + d.days + '日ぶん（' + d.from + '〜' + d.to + '）を消します。\n\n'
            + '・在庫の数は変わりません\n・CSVを入れ直せば戻せます\n\n消しますか？')) return;
  try{ KemuriData.daily.clear(); }catch(e){}
  refresh(); render(); toast('日別の売上を消しました');
}

function savePass(){
  const v = (document.getElementById('pass')||{}).value || '';
  try{ localStorage.setItem(PASS_KEY, v.trim()); }catch(e){}
  PING = { loading:false, msg:'', ok:false };
  render(); toast('保存しました');
}
async function testAI(){
  const v = (document.getElementById('pass')||{}).value || '';
  try{ localStorage.setItem(PASS_KEY, v.trim()); }catch(e){}
  PING = { loading:true, msg:'', ok:false }; render();
  try{
    const r = await callAI('ping', {});
    PING = { loading:false, ok:true, msg:'つながりました（モデル：' + (r.model || '不明') + '）' };
  }catch(e){
    PING = { loading:false, ok:false, msg:(e && e.userMsg) || 'うまくいきませんでした' };
  }
  render();
}

/* ============================================================
   画面の組み立て
   ============================================================ */
const TABS = [
  ['sum','売上','📊'], ['cost','原価','💰'], ['recipe','レシピ','📖'], ['set','設定','⚙️'],
];
function go(t){ TAB = t; render(); window.scrollTo(0,0); }
function render(){
  const titles = { sum:['売上・原価', rangeLabel()], cost:['仕入原価','単価マスタ'],
                   recipe:['レシピ','メニュー → 材料'], set:['設定','合言葉・データ'] };
  const ti = titles[TAB] || ['売上・原価',''];
  document.getElementById('h-title').textContent = ti[0];
  document.getElementById('h-sub').textContent = ti[1];

  const v = document.getElementById('view');
  v.innerHTML = TAB === 'sum' ? viewSum()
              : TAB === 'cost' ? viewCost()
              : TAB === 'recipe' ? viewRecipe()
              : viewSet();

  document.getElementById('tabbar').innerHTML = TABS.map(([k,l,ic]) =>
    '<button class="' + (TAB===k?'on':'') + '" onclick="go(\'' + k + '\')">'
    + '<span class="ic">' + ic + '</span>' + l + '</button>').join('');
}

/* ---- 起動 ---- */
(function(){
  refresh();
  const c = readCache(); if(c) AI = { loading:false, error:'', result:c.result, at:c.at };
  render();
})();
</script>
