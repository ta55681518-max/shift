<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冷凍在庫">
<title>KEMURI屋 冷凍在庫</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#f2f2f4;color:#1a1a1a;font-size:16px;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  }
  #app{max-width:560px;margin:0 auto;background:#fff;min-height:100%;
       padding-bottom:calc(92px + env(safe-area-inset-bottom));}
  button,.step div,.file-btn{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;touch-action:manipulation;
    -webkit-user-select:text;user-select:text;}
  .chk:active,.stp button:active,.bigqty button:active{background:#ececee;}

  /* ヘッダー */
  .header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ececec;
          padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;}
  .header h1{font-size:19px;font-weight:700;flex:1;}
  .header .sub{font-size:12px;color:#999;font-weight:400;display:block;margin-top:2px;}
  .pad{padding:14px 16px 20px;}

  /* 発注サマリー */
  .summary{margin:14px 16px 6px;border-radius:18px;padding:18px 16px;text-align:center;}
  .summary.ng{background:#ffefec;border:2px solid #ffc9bf;}
  .summary.ok{background:#eafaf1;border:2px solid #b9ebd0;}
  .summary .big{font-size:40px;font-weight:800;line-height:1.1;}
  .summary.ng .big{color:#d92d20;}
  .summary.ok .big{color:#0a9d55;}
  .summary .lab{font-size:15px;font-weight:700;margin-top:4px;color:#555;}
  .summary .go{margin-top:12px;background:#d92d20;color:#fff;border:none;border-radius:13px;
               padding:13px 18px;font-size:16px;font-weight:700;width:100%;}

  /* 在庫リスト */
  .list{padding:6px 12px 16px;}
  .row{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1.5px solid #ededed;
       border-radius:15px;padding:14px 14px;margin-bottom:9px;text-align:left;}
  .row:active{background:#fafafa;}
  .row.ng{border-color:#ffc9bf;background:#fffaf9;}
  .row .nm{flex:1;font-size:19px;font-weight:700;letter-spacing:.3px;line-height:1.3;word-break:break-word;}
  .row .qty{font-size:28px;font-weight:800;min-width:54px;text-align:right;font-variant-numeric:tabular-nums;}
  .row .st{min-width:72px;text-align:center;border-radius:999px;font-weight:800;padding:7px 0;font-size:15px;}
  .st.ok{background:#eafaf1;color:#0a9d55;font-size:19px;}
  .st.few{background:#fff6e0;color:#c07d00;font-size:19px;}
  .st.ng{background:#d92d20;color:#fff;}
  .sec{font-size:13px;color:#999;font-weight:700;margin:14px 4px 8px;}
  /* 分類・仕入先の見出し。品目が増えて一覧が長くなったときの区切り */
  .cath{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
        margin:16px 12px 2px;font-size:15px;font-weight:800;color:#333;}
  .cath span{font-size:12px;font-weight:600;color:#aaa;}
  .cath b{color:#d92d20;}
  .row .qty .un{font-size:12px;font-weight:600;color:#aaa;margin-left:2px;}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:#888;padding:2px 0 10px;flex-wrap:wrap;}

  /* 汎用ボタン・カード */
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;text-align:center;}
  .btn-primary{background:#e8531f;color:#fff;}
  .btn-dark{background:#222;color:#fff;}
  .btn-gray{background:#f1f1f3;color:#333;}
  .btn-out{background:#fff;border:1.5px solid #ddd;color:#333;}
  .btn-danger{background:#fff0ee;color:#d33;}
  .btn:disabled{background:#ededed;color:#aaa;}
  .btn-sm{width:auto;padding:11px 15px;font-size:15px;border-radius:12px;}
  .card{border:1.5px solid #ededed;border-radius:16px;padding:14px;margin-bottom:12px;}
  .card h2{font-size:15px;font-weight:700;margin-bottom:10px;}
  .muted{font-size:13px;color:#8a8a8a;line-height:1.6;}
  .opt{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .opt input{width:22px;height:22px;flex:none;accent-color:#e8531f;}
  .gap{margin-top:10px;}
  .warn{background:#fff8e6;border:1.5px solid #ffe0a3;border-radius:14px;padding:12px 14px;font-size:14px;color:#8a6100;line-height:1.6;}
  .ok-box{background:#eafaf1;border:1.5px solid #b9ebd0;border-radius:14px;padding:12px 14px;font-size:14px;color:#0a7a44;line-height:1.6;}
  .info{background:#f4f7ff;border:1.5px solid #d8e3ff;border-radius:14px;padding:12px 14px;font-size:14px;color:#3a4d8f;line-height:1.6;}

  /* 発注チェックリスト */
  .chk{display:flex;align-items:center;gap:13px;width:100%;border:1.5px solid #ededed;background:#fff;
       border-radius:15px;padding:15px 14px;margin-bottom:9px;text-align:left;}
  .chk .box{width:30px;height:30px;border-radius:9px;border:2.5px solid #ccc;flex:0 0 auto;
            display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;font-weight:800;}
  .chk.on{background:#f7fbf8;border-color:#b9ebd0;}
  .chk.on .box{background:#0a9d55;border-color:#0a9d55;}
  .chk .nm{flex:1;font-size:19px;font-weight:700;}
  .chk.on .nm{color:#8a8a8a;text-decoration:line-through;}
  .chk .now{font-size:13px;color:#999;font-weight:600;}

  /* 数量ステッパー */
  .stp{display:flex;align-items:center;gap:8px;border:1.5px solid #ededed;border-radius:15px;padding:11px 12px;margin-bottom:9px;}
  .stp .nm{flex:1;font-size:17px;font-weight:700;line-height:1.3;word-break:break-word;}
  .stp .now{font-size:12px;color:#aaa;font-weight:600;margin-top:2px;display:block;}
  .stp button{width:44px;height:44px;border-radius:12px;border:none;background:#f1f1f3;font-size:23px;font-weight:700;flex:0 0 auto;}
  .stp input{width:62px;height:44px;border:1.5px solid #e2e2e2;border-radius:12px;text-align:center;
             font-size:21px;font-weight:800;background:#fff;}
  .stp.on{border-color:#ffd0bd;background:#fffaf8;}

  /* POS */
  .step{display:flex;gap:6px;margin-bottom:14px;}
  .step div{flex:1;text-align:center;font-size:13px;font-weight:700;color:#bbb;padding:14px 2px;border-radius:12px;background:#f6f6f8;}
  .step div.on{background:#e8531f;color:#fff;}
  .prev{display:flex;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid #f2f2f2;}
  .prev .nm{flex:1;font-size:17px;font-weight:700;}
  .prev .sl{font-size:13px;color:#888;}
  .prev .mv{font-size:20px;font-weight:800;color:#d92d20;min-width:54px;text-align:right;}
  .prev .mv.plus{color:#0a9d55;}
  .map-row{border:1.5px solid #ffe0a3;background:#fffdf6;border-radius:14px;padding:12px;margin-bottom:9px;}
  .map-row .nm{font-size:17px;font-weight:700;margin-bottom:8px;}
  select.sel{width:100%;padding:13px;font-size:16px;border:1.5px solid #e2e2e2;border-radius:12px;background:#fff;}
  label.lab{display:block;font-size:13px;color:#888;font-weight:700;margin:12px 0 6px;}
  input.txt{width:100%;padding:13px;font-size:17px;border:1.5px solid #e2e2e2;border-radius:12px;background:#fff;}
  .file-btn{display:block;text-align:center;background:#e8531f;color:#fff;border-radius:14px;padding:18px;font-size:18px;font-weight:700;}
  input[type=file]{display:none;}
  table.peek{width:100%;border-collapse:collapse;font-size:11px;color:#666;}
  table.peek td{border:1px solid #eee;padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;}
  table.peek tr.head td{background:#f6f6f8;font-weight:700;color:#333;}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* 履歴 */
  .hist{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid #f2f2f2;font-size:14px;align-items:baseline;}
  .hist .t{font-size:11px;color:#aaa;min-width:82px;}
  .hist .n{font-weight:700;flex:1;}
  .hist .d{font-weight:800;}
  .hist .r{font-size:11px;color:#999;}

  /* タブバー */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
          border-top:1px solid #ececec;display:flex;max-width:560px;margin:0 auto;
          padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);}
  .tabbar button{flex:1;border:none;background:none;padding:9px 0 8px;font-size:11px;font-weight:700;color:#aaa;position:relative;}
  .tabbar button .ic{display:block;font-size:21px;line-height:1.25;}
  .tabbar button.on{color:#e8531f;}
  .tabbar.hide{display:none;}
  .tabbar button .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:#d92d20;color:#fff;
       border-radius:999px;min-width:18px;height:18px;font-size:11px;line-height:18px;padding:0 5px;}

  /* シート */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end;justify-content:center;}
  .ov.show{display:flex;}
  .sheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;
         padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .18s ease;}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:19px;font-weight:700;text-align:center;margin-bottom:4px;}
  .sheet .sh-sub{font-size:12px;color:#999;text-align:center;margin-bottom:14px;}
  .bigqty{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 14px;}
  .bigqty button{width:70px;height:70px;border-radius:22px;border:none;background:#f1f1f3;font-size:34px;font-weight:700;}
  .bigqty .v{font-size:52px;font-weight:800;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips button{border:1.5px solid #e2e2e2;background:#fff;border-radius:999px;padding:10px 15px;font-size:14px;font-weight:700;color:#666;}
  .chips button.on{border-color:#e8531f;background:#fff4ef;color:#e8531f;}
  /* 発注リストの1行 */
  .orow{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid #f0f0f0;}
  .orow:last-of-type{border-bottom:none;}
  .orow.off{opacity:.42;}
  .orow .ock{font-size:24px;line-height:1.1;color:#e8531f;background:none;border:none;padding:0 2px;}
  .orow.off .ock{color:#bbb;}
  .orow .ob{flex:1;min-width:0;}
  /* «>» を付けないと、小さい字の中の太字まで行が分かれてしまう */
  .orow .ob > b{display:block;font-size:17px;font-weight:700;line-height:1.3;word-break:break-word;}
  .orow .ob small{display:block;font-size:12px;color:#8a8a8a;line-height:1.6;}
  .oq{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .oq button{border:1.5px solid #e2e2e2;background:#fff;border-radius:10px;padding:10px 8px;
             font-size:13px;font-weight:700;color:#555;min-width:46px;}
  .oq button:active{background:#f1f1f3;}
  .oq input{width:68px;padding:10px 8px;font-size:19px;font-weight:800;text-align:center;
            border:1.5px solid #e2e2e2;border-radius:10px;background:#fff;
            font-variant-numeric:tabular-nums;}
  .oq .ou{font-size:13px;color:#888;font-weight:700;min-width:26px;}

  /* バックアップを «選んで» 戻すときの1行 */
  .bk-row{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;
          border:1.5px solid #ededed;border-radius:14px;padding:13px 14px;margin-bottom:8px;}
  .bk-row.on{border-color:#e8531f;background:#fff8f5;}
  .bk-row .bk-ck{font-size:20px;line-height:1.2;color:#bbb;}
  .bk-row.on .bk-ck{color:#e8531f;}
  .bk-row .bk-b{flex:1;display:block;}
  .bk-row b{display:block;font-size:16px;font-weight:700;margin-bottom:3px;}
  .bk-row small{display:block;font-size:12px;color:#8a8a8a;line-height:1.5;}
  .bk-row small.bk-ng{color:#c0392b;font-weight:700;margin-top:3px;}
  .two{display:flex;gap:10px;margin-top:14px;}
  .two .btn{flex:1;}
  textarea{width:100%;min-height:110px;padding:12px;font-size:13px;border:1.5px solid #e2e2e2;border-radius:12px;background:#fff;}
  .toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:#222;color:#fff;padding:13px 20px;border-radius:24px;font-size:15px;font-weight:700;
         opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90%;text-align:center;}
  .toast.show{opacity:.96;}
</style>
<!-- 古いURLのお知らせ。アプリ本体より先に読む（取り込みボタンの売上を読み取られる前に新しいURLへ送るため） -->
<script src="site-notice.js?v=20261008a"></script>
</head>
<body>
<div id="app">
  <div class="header">
    <div style="flex:1">
      <h1 id="h-title">冷凍在庫</h1>
      <span class="sub" id="h-sub">串焼KEMURI屋</span>
    </div>
    <button id="h-act" class="btn btn-gray btn-sm" style="display:none"></button>
  </div>

</div>

<nav class="tabbar" id="tabbar"></nav>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">

</div>

<input type="file" id="bkfile" accept=".json,application/json,text/plain" onchange="bkPick(this)">
<input type="file" id="csvfile" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain,application/csv,application/vnd.ms-excel" onchange="onPickFile(this)">
<input type="file" id="dayfile" multiple accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain,application/csv,application/vnd.ms-excel" onchange="onPickDaily(this)">

<!-- 共通の土台（小道具・売上履歴）と、売上の取得層。アプリ本体より先に読む -->
<script src="kemuri-core.js?v=20261008a"></script>
<script src="kemuri-backup.js?v=20261008a"></script>
<script src="pos-source.js?v=20261008a"></script>

<script src="kemuri-data.js?v=20261008a"></script>

<script>
/* ============================================================
   串焼KEMURI屋 冷凍在庫アプリ
   ・保存先 … localStorage['kemuri_reitou_v1']（この端末のみ）
   ・考え方 … 1人前 ＝ 在庫1。POSで売れたぶんを自動で引く。
   ============================================================ */
const LS_KEY = 'kemuri_reitou_v1';
const FEW    = 2;   // 発注ライン＋この数までを「△ 残り少ない」とする
/* 在庫は 0.1 きざみで持つ。0.1+0.2 が 0.30000000000000004 になるので、
   足し引きのたびにここを通して丸める。 */
const q1 = x => Math.round((Number(x) || 0) * 10) / 10;

/* 最初に登録する冷凍在庫と発注ライン（名前, 発注ライン） */
const SEED = [
  ['ポテトフライ',5],['枝豆',5],['カマンベールチーズフライ',5],['イカゲソ',5],
  ['鶏皮餃子',5],['レバーペースト',4],['アジフライ',2],['ごぼうの唐揚げ',3],
  ['ももたたき',3],['昆布締めたたき',3],['馬レバ刺し',3],['手羽先唐揚げ',10],
  ['串カツ',10],['春巻き',5],['燻製ベーコン',5],['しめさば',4],
  ['豚バラ串',5],['やげん',5],['鶏はらみ',3],['軟骨唐揚げ',3],['ハツと砂肝の唐揚げ',3]
];

/* エクストリンクPOSの実際の商品名 → 冷凍在庫の対応（初期設定。設定タブで変更・解除できる）
   ※シーザーサラダは燻製ベーコンを使うため、売れたら燻製ベーコンの在庫を引く */
const SEED_POS = [
  ['茶豆','枝豆'],
  ['手造りカマンベールチーズフライ','カマンベールチーズフライ'],
  ['イカゲソ唐揚げ','イカゲソ'],
  ['鶏皮ギョウザ','鶏皮餃子'],
  ['レバーペースト（バケット5枚付き）','レバーペースト'],
  ['長崎産アジフライ','アジフライ'],
  ['鹿児島産鶏モモタタキ','ももたたき'],
  ['鶏むね昆布締めタタキ','昆布締めたたき'],
  ['鶏はらみ炙り','鶏はらみ'],
  ['鶏軟骨唐揚げ','軟骨唐揚げ'],
  ['ハツと砂肝のおろしネギポン酢','ハツと砂肝の唐揚げ'],
  ['鶏みそ串カツ','串カツ'],
  ['串カツおろしポン酢','串カツ'],
  ['クルミとブルーチーズの春巻','春巻き'],
  ['シーザーサラダ','燻製ベーコン'],
  ['炙りシメサバ','しめさば'],
  ['県産豚バラ串','豚バラ串'],
  ['ヤゲンなんこつ','やげん']
];
const REASONS = ['棚卸（数え直し）','廃棄','まかない','こぼした','数え間違い','その他'];

/* 分類。冷凍以外を増やしていくための入れ物。
   pos … POSの売上から自動で在庫を引くかどうか。
         調味料や備品は「1皿でどれだけ減るか」が決まらないので棚卸だけで回す。
   ※ k（キー）は保存したデータに残るので、後から変えないこと。名前と絵文字は変えてよい。 */
const HTML_BUILD = '2026-10-08a';            /* JSの ?v= と揃えること */
const CATS = [
  { k:'frozen', name:'冷凍',         ic:'🧊', pos:true  },
  { k:'fresh',  name:'生鮮',         ic:'🥬', pos:true  },
  { k:'drink',  name:'ドリンク',     ic:'🍺', pos:true  },
  { k:'dry',    name:'乾物・調味料', ic:'🧂', pos:false },
  { k:'misc',   name:'備品',         ic:'🧻', pos:false }
];
const CAT0 = 'frozen';                       /* 分類が入っていない品目はこれ扱い */
const UNITS = ['個','本','枚','袋','パック','kg','g','ケース','箱','L','ml'];
function cat(k){ return CATS.find(c=>c.k===k) || CATS[0]; }
function catOf(it){ return cat(it && it.cat); }
/* POSから自動で在庫を引くか。
   分類は «棚卸で回る順» を決めるためのもので、引く・引かないとは別の話。
   ドレッシングは «乾物・調味料» が正しいが自動で引きたい、という組み合わせが
   あるので、商品ごとに上書きできるようにしてある。
   it.auto … undefined なら分類どおり。true/false なら商品の設定が勝つ。 */
function autoPos(it){ return (it && it.auto != null) ? !!it.auto : catOf(it).pos; }
/* その商品の分類の «ふつう» はどちらか */
function autoDefault(catKey){ return cat(catKey).pos; }
/* いま使われている分類だけを、CATS の並び順で返す */
function usedCats(){ return CATS.filter(c=>DB.items.some(i=>(i.cat||CAT0)===c.k)); }

/* ---------- データ ----------
   items[] = { id, name, stock, min, per, cost, cat, sup, unit }
       min … 発注ライン（この数以下で「発注」）
       per … POS販売1に対して減らす在庫数（1皿で2個使うなら2）
       cat … 分類（CATS のキー）。発注リストと在庫一覧の並べ分けに使う
       sup … 仕入先。発注リストをここでまとめる（空なら「仕入先なし」）
       unit… 単位（個・本・kg…）。数字のうしろに出すだけで、計算には使わない
   sups[] … これまでに使った仕入先。入力の候補に出すためだけのもの
   supCfg … 仕入先ごとの注文のしかた。{ 仕入先名: { how:'line'|'app'|'', url } }
             how … '' は «まだ決めていない»。画面で選んでもらう
             url … 専用アプリ業者の注文サイト。入っているときだけボタンを出す
   orders[] … 発注の記録。{ id, at, sup, date, lines:[{itemId,name,qty,unit,got}] }
             got … そのうち入荷ずみの数。qty-got が «未入荷»。
             発注しても在庫は増やさない（増えるのは入荷を記録したとき）
   map   … POS商品名(正規化) -> { item:itemId | '__skip__', label:表示名 }
   seen  … 取込済み売上行のキー（同じ売上を二重で引かないため）
   history[] … { at, name, before, after, reason }
   imports[] … { id, at, file, rows, lines:[{itemId,qty}], keys:[], undone }
*/
function blank(){
  return { v:1, seq:1, items:[], map:{}, seen:{}, applied:{}, history:[], imports:[],
           csvMap:null, ordered:{}, sups:[], supCfg:{}, orders:[],
           /* last … «前に追加したときに選んだもの»。品目をまとめて登録するとき、
              ドリンクを10品続けて入れるのに毎回選び直さずに済むように覚えておく。 */
           last:{ cat:CAT0, sup:'', unit:'個' } };
}
let DB = load();
let TAB = 'stock';

function load(){
  try{
    const r = localStorage.getItem(LS_KEY);
    if(r) return migrate(Object.assign(blank(), JSON.parse(r)));
  }catch(e){}
  const d = blank();
  SEED.forEach(([name,min])=>{
    const id = d.seq++;
    d.items.push({ id, name, stock:min, min, per:1, cost:0 });
    d.map[norm(name)] = { item:id, label:name };
  });
  applySeedPos(d);
  d.posSeeded = 1;
  return d;
}
/* 後から足した項目を、既存のデータに埋める（入っている値はそのまま） */
function migrate(d){
  let changed = false;
  (d.items||[]).forEach(it=>{
    /* cost … 1個あたりの仕入原価（円）。0＝未入力。原価率と発注金額の計算に使う */
    if(it.cost == null){ it.cost = 0; changed = true; }
    /* 分類・仕入先・単位。冷凍以外を増やせるように後から足した。
       それまでに入っていたのは全部冷凍なので、既定は冷凍・単位「個」でよい。 */
    if(!it.cat){ it.cat = CAT0; changed = true; }
    if(it.sup == null){ it.sup = ''; changed = true; }
    if(!it.unit){ it.unit = '個'; changed = true; }
  });
  if(!Array.isArray(d.sups)){ d.sups = []; changed = true; }
  if(!d.supCfg || typeof d.supCfg !== 'object'){ d.supCfg = {}; changed = true; }
  if(!Array.isArray(d.orders)){ d.orders = []; changed = true; }
  if(!d.last || !d.last.cat){ d.last = { cat:CAT0, sup:'', unit:'個' }; changed = true; }
  if(changed){ try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){} }
  return d;
}
/* POS名の初期対応を入れる（すでに設定済みのものは触らない） */
function applySeedPos(d){
  let changed = false;
  SEED_POS.forEach(([pos,name])=>{
    const it = d.items.find(i=>i.name===name); if(!it) return;
    const k = norm(pos);
    if(!d.map[k]){ d.map[k] = { item:it.id, label:pos }; changed = true; }
  });
  return changed;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast('保存できんかった…'); } }

/* ---------- 小道具 ---------- */
/* num / norm の中身は kemuri-core.js にまとめた（他のアプリでも同じものを使うため）。
   ※ norm は「POS商品名の対応表」のキーを作っている。中身を変えると
      既存の対応表が引けなくなるので、core 側も触らないこと。 */
function num(v){ return KemuriCore.num(v); }
function escArg(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return KemuriCore.norm(s); }
function item(id){ return DB.items.find(i=>i.id===id); }
/* 数字のうしろに出す単位。「個」は今までどおり付けない（見た目を変えないため） */
function unitTag(it){
  const u = it && it.unit;
  return (!u || u === '個') ? '' : '<span class="un">'+esc(u)+'</span>';
}
/* POSの商品名は「揚物/ポテトフライ」「★ポテトフライ」のように書かれることがあるので、
   そのまま → 先頭の記号を外す → 「/」の後ろ、の順に対応表を照合する */
function posVariants(name){
  const v = [], add = x=>{ x = String(x||'').trim(); if(x && v.indexOf(x)<0) v.push(x); };
  add(name);
  const bare = String(name||'').replace(/^[\s★☆◆◇♦●○◎■□▲△▼▽※・?？\-]+/,'');
  add(bare);
  const parts = bare.split('/');
  if(parts.length>1){ add(parts[parts.length-1]); add(parts.slice(1).join('/')); }
  return v;
}
/* 候補さがし用のゆるい正規化：カタカナ→ひらがな、記号・かっこを落とす */
function loose(s){
  return String(s||'').normalize('NFKC').toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/餃子/g,'ぎょうざ').replace(/唐揚/g,'からあげ').replace(/揚げ?物/g,'あげもの')
    .replace(/[\s　()（）\[\]【】「」・,，、。.／\/\-－—–~〜～*★☆◆◇●○◎■□▲△▼▽※?？!！]/g,'');
}
/* POS商品名から在庫商品の候補を1つ提案する（対応づけるかは人が決める） */
function suggestItem(posName){
  const t = loose(posName); if(!t) return null;
  let best = null;
  DB.items.forEach(it=>{
    const n = loose(it.name); if(n.length < 2) return;
    const n2 = n.replace(/[ぁ-ん]$/,'');            // 「春巻き」→「春巻」の送り仮名ゆれ
    const hit = t.indexOf(n) >= 0 || (n2.length >= 2 && t.indexOf(n2) >= 0);
    if(hit && (!best || n.length > loose(best.name).length)) best = it;
  });
  return best;
}
/* ============================================================
   レシピ（材料と数量）
   ------------------------------------------------------------
   サラダのように材料をいくつも使うメニューは、1対1の対応表では
   表せない。レシピがあれば材料ごとに引き、無ければこれまでどおり
   «その商品そのもの» を1対1で引く。
   レシピはダッシュボードの📖レシピで作る。ここでは読むだけ。
   ============================================================ */
const RECIPE_KEY = 'kemuri_recipes_v1';
function recipeOf(name){
  try{
    const d = JSON.parse(localStorage.getItem(RECIPE_KEY) || '{}');
    const r = (d && d.items) ? d.items[norm(name)] : null;
    return (r && Array.isArray(r.parts) && r.parts.length) ? r : null;
  }catch(e){ return null; }
}
/* 単位合わせ。g↔kg・ml↔L だけ。知らない組み合わせはそのままの数で通す */
const UNIT_K = { g:1, kg:1000, グラム:1, キロ:1000, キログラム:1000,
                 ml:1, l:1000, cc:1, ミリリットル:1, リットル:1000 };
const UNIT_B = { g:'g', kg:'g', グラム:'g', キロ:'g', キログラム:'g',
                 ml:'ml', l:'ml', cc:'ml', ミリリットル:'ml', リットル:'ml' };
function convQty(qty, from, to){
  const f = String(from||'').trim(), t = String(to||'').trim();
  if(!f || !t || norm(f) === norm(t)) return qty;
  const a = UNIT_B[norm(f)], b = UNIT_B[norm(t)];
  if(a && b && a === b) return qty * UNIT_K[norm(f)] / UNIT_K[norm(t)];
  return qty;                                   /* 「個」と「kg」など。数はそのまま */
}
function itemByName(name){
  const k = norm(name); if(!k) return null;
  return DB.items.find(i=>norm(i.name) === k) || null;
}
/* そのPOS商品が1つ売れると、どの在庫をいくつ使うか。
   戻り値 … [{ it, per }]。引けなければ空 */
function usesFor(posName){
  const r = recipeOf(posName);
  if(r){
    const out = [];
    r.parts.forEach(x=>{
      const it = itemByName(x.name);
      if(!it) return;                           /* 在庫に無い材料は数えない */
      const per = convQty(Number(x.qty) || 1, x.unit, it.unit);
      if(per > 0) out.push({ it, per });
    });
    if(out.length) return out;
  }
  const m = lookup(posName);
  if(!m || m.item === '__skip__') return [];
  const it2 = item(m.item);
  return it2 ? [{ it: it2, per: Number(it2.per) || 1 }] : [];
}

function lookup(name){
  const vs = posVariants(name);
  for(let i=0;i<vs.length;i++){ const m = DB.map[norm(vs[i])]; if(m) return m; }
  return null;
}
function nowISO(){ return new Date().toISOString(); }
function fmtDT(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const p = n=>('0'+n).slice(-2);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function fmtDay(iso){ const d = new Date(iso); return isNaN(d)? '' : (d.getMonth()+1)+'/'+d.getDate(); }
function agoText(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const a = new Date(), day = 24*60*60*1000;
  const n = Math.floor((new Date(a.getFullYear(),a.getMonth(),a.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/day);
  return n<=0 ? '今日' : (n===1 ? '昨日' : n+'日前');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* 状態判定：発注 / △ / ○ */
function state(it){
  if(it.stock <= it.min) return 'ng';
  if(it.stock <= it.min + FEW) return 'few';
  return 'ok';
}
function stateLabel(s){ return s==='ng' ? '発注' : (s==='few' ? '△' : '○'); }
function needList(){ return DB.items.filter(i=>state(i)==='ng'); }

/* 在庫を動かす（履歴つき） */
function move(it, after, reason){
  const before = it.stock;
  it.stock = Math.max(0, q1(after));
  if(before === it.stock) return;
  DB.history.unshift({ at:nowISO(), name:it.name, before, after:it.stock, reason });
  if(DB.history.length > 500) DB.history.length = 500;
}

function byUrgency(a,b){
  const rank = { ng:0, few:1, ok:2 };
  const d = rank[state(a)] - rank[state(b)];
  return d ? d : (a.stock - a.min) - (b.stock - b.min);
}

/* ---------- ② 発注リスト ---------- */
/* 仕入先ごとにまとめる。仕入先が1つも入っていないうちは分類でまとめ、
   それも1つだけなら «まとめない»（冷凍しか無いいまの状態の見た目を変えないため）。 */
/* ============================================================
   業者別の発注
   ------------------------------------------------------------
   仕入先ごとに «注文のしかた» を持たせ、不足している商品だけを
   まとめて出す。LINEの業者には注文文を作り、専用アプリの業者には
   手で打ち込みやすい一覧を出す。
   ・発注数量は不足量と別に持つ。既定は不足量だが、画面で変えられる
   ・発注単位や入数は登録していないので、袋やケースへの換算はしない
   ・発注しても在庫は増やさない。増えるのは入荷を記録したとき
   ============================================================ */
const SHOP = '串焼KEMURI屋';
const NOSUP = '\u0001nosup';                 /* 仕入先が空の商品をまとめるための内部キー */

/* 数量の表示。0.1きざみで丸めて、1.0 → 1 のように整える。
   2.2000000000000002 のような浮動小数のゴミを画面に出さないため。 */
function fmtQ(n){ return String(q1(n)); }
function unitOf(it){ return it.unit || '個'; }
function qu(n, it){ return fmtQ(n) + unitOf(it); }

function supName(key){ return key === NOSUP ? '仕入先なし' : key; }
function supCfg(key){
  const c = (DB.supCfg || {})[key];
  return { how:(c && c.how) || '', url:(c && c.url) || '' };
}
function setSupHow(key, how){
  DB.supCfg = DB.supCfg || {};
  const c = DB.supCfg[key] = DB.supCfg[key] || { how:'', url:'' };
  c.how = how; save(); render();
}
function askSupUrl(key){
  const c = supCfg(key);
  const v = prompt('注文サイトのURL（空にすると消します）', c.url || '');
  if(v === null) return;                      /* やめた */
  DB.supCfg[key] = DB.supCfg[key] || { how:'app', url:'' };
  DB.supCfg[key].url = String(v).trim();
  save(); render();
  toast(DB.supCfg[key].url ? 'URLを保存しました' : 'URLを消しました');
}

/* その商品の «発注したがまだ届いていない» 数 */
function pendingOf(itemId){
  let n = 0;
  (DB.orders || []).forEach(o=>o.lines.forEach(l=>{
    if(l.itemId === itemId) n += Math.max(0, num(l.qty) - num(l.got));
  }));
  return q1(n);
}
/* 入荷したぶんを «未入荷» から古い順に消していく。
   発注の記録と実際の入荷をつなぐのはここだけ。 */
function fillPending(itemId, qty){
  let rest = q1(qty);
  const list = (DB.orders || []).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  list.forEach(o=>o.lines.forEach(l=>{
    if(rest <= 0 || l.itemId !== itemId) return;
    const left = Math.max(0, num(l.qty) - num(l.got));
    if(left <= 0) return;
    const take = Math.min(left, rest);
    l.got = q1(num(l.got) + take);
    rest = q1(rest - take);
  }));
  /* 全部届いた商品は「発注済み」の印を外す */
  if(pendingOf(itemId) <= 0) delete DB.ordered[itemId];
}

/* 不足している商品を仕入先ごとにまとめる */
function needBySup(){
  const by = {};
  needList().forEach(i=>{ const k = i.sup || NOSUP; (by[k] = by[k] || []).push(i); });
  return Object.keys(by).sort((a,b)=>(a===NOSUP?1:0)-(b===NOSUP?1:0) || a.localeCompare(b,'ja'))
           .map(k=>({ key:k, items:by[k].sort((a,b)=>(a.stock-a.min)-(b.stock-b.min)) }));
}
/* 不足量 … 発注ラインまで戻すのに要る数。ちょうどラインなら 0 */
function shortOf(it){ return q1(Math.max(0, num(it.min) - num(it.stock))); }

/* 画面で触っているぶん（発注数量と、外した商品）。保存はしない */
let ORD = { qty:{}, off:{}, date:'', sheet:null, text:'', chk:{} };
function ordQty(it){
  const v = ORD.qty[it.id];
  return v == null ? shortOf(it) : q1(v);
}
function ordOn(it){ return !ORD.off[it.id] && ordQty(it) > 0; }
function ordSetQty(id, v){
  const it = item(id); if(!it) return;
  ORD.qty[id] = Math.max(0, q1(num(v)));
  paintOrdRow(id);
}
function ordStep(id, d){
  const it = item(id); if(!it) return;
  ORD.qty[id] = Math.max(0, q1(ordQty(it) + d));
  paintOrdRow(id);
}
function ordToggle(id){
  if(ORD.off[id]) delete ORD.off[id]; else ORD.off[id] = 1;
  render();
}
/* 行だけ描き直す（画面ごと作り直すと入力中の値が飛ぶため） */
function paintOrdRow(id){
  const it = item(id); if(!it) return;
  const v = document.getElementById('oq-'+id);
  if(v) v.value = fmtQ(ordQty(it));
  const row = document.getElementById('or-'+id);
  if(row) row.classList.toggle('off', !ordOn(it));
}
/* 注文する商品だけ。数量0と、外したものは入れない */
function ordLines(key){
  const g = needBySup().find(x=>x.key === key);
  if(!g) return [];
  return g.items.filter(ordOn).map(it=>({ it, qty:ordQty(it) }));
}

/* 注文文。業者ごとに、その業者の商品だけで作る */
function ordText(key){
  const lines = ordLines(key);
  const nm = key === NOSUP ? '' : key;
  let t = (nm ? nm + '様\n' : '')
        + 'お世話になっております。' + SHOP + 'です。\n'
        + '下記の注文をお願いします。\n\n'
        + lines.map(l=>'・' + l.it.name + '　' + qu(l.qty, l.it)).join('\n');
  if(ORD.date) t += '\n\n希望納品日：' + fmtDate(ORD.date);
  t += '\n\nよろしくお願いいたします。';
  return t;
}
/* 専用アプリ業者に出す、打ち込み用の一覧 */
function ordListText(key){
  return ordLines(key).map(l=>l.it.name + '　' + qu(l.qty, l.it)).join('\n');
}
function fmtDate(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return String(iso||'');
  const d = new Date(iso+'T00:00:00');
  const w = isNaN(d) ? '' : '（'+DOW[d.getDay()]+'）';
  return (+m[2]) + '月' + (+m[3]) + '日' + w;
}
const DOW = ['日','月','火','水','木','金','土'];

function viewOrder(){
  const groups = needBySup();
  if(!groups.length){
    return '<div class="pad"><div class="summary ok"><div class="big">OK</div>'
      + '<div class="lab">発注が必要な商品はありません</div></div>'
      + ordPendingCard() + '</div>';
  }
  const n = groups.reduce((a,g)=>a+g.items.length, 0);
  let h = '<div class="pad">';
  h += '<div class="muted" style="margin-bottom:12px">発注ライン以下の <b>'+n+'商品</b>です。'
     + '仕入先ごとに注文できます。</div>';
  groups.forEach(g=>{ h += ordCard(g); });
  h += ordPendingCard();
  h += '</div>';
  return h;
}

/* 仕入先1つぶんのカード */
function ordCard(g){
  const key = g.key, cfg = supCfg(key);
  const on = g.items.filter(ordOn).length;
  let h = '<div class="card gap" style="padding:14px 12px">'
        + '<div class="cath" style="margin:0 2px 10px">'
        + '<b style="font-size:18px;color:#222">'+esc(supName(key))+'</b>'
        + '<span>'+(cfg.how==='line' ? 'LINEで注文' : cfg.how==='app' ? '専用アプリ' : '注文方法が未設定')+'</span></div>';

  g.items.forEach(it=>{ h += ordRow(it); });

  if(!cfg.how){
    h += '<div class="warn gap">この仕入先の注文方法がまだ決まっていません。</div>'
       + '<div class="two"><button class="btn btn-dark" onclick="setSupHow(\'' + esc(key).replace(/'/g,"\\'") + '\',\'line\')">LINEで注文</button>'
       + '<button class="btn btn-gray" onclick="setSupHow(\'' + esc(key).replace(/'/g,"\\'") + '\',\'app\')">専用アプリ</button></div>'
       + '</div>';
    return h;
  }

  const k = esc(key).replace(/'/g,"\\'");
  if(cfg.how === 'line'){
    h += '<label class="lab">希望納品日（入れなければ書きません）</label>'
       + '<input class="txt" type="date" value="'+esc(ORD.date)+'" onchange="ORD.date=this.value">'
       + '<button class="btn btn-primary gap" ' + (on?'':'disabled') + ' onclick="ordOpenLine(\''+k+'\')">'
       +   '📱 注文文をつくる（' + on + '品）</button>';
  }else{
    h += '<button class="btn btn-primary gap" ' + (on?'':'disabled') + ' onclick="ordOpenApp(\''+k+'\')">'
       +   '📋 注文リストを見る（' + on + '品）</button>'
       + '<button class="btn btn-out gap" ' + (on?'':'disabled') + ' onclick="ordCopy(\''+k+'\',1)">注文リストをコピー</button>'
       + (cfg.url
          ? '<a class="btn btn-dark gap" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(cfg.url)+'">🌐 注文サイトを開く</a>'
          : '');
  }
  h += '<div class="two"><button class="btn btn-gray btn-sm" onclick="ordSetup(\''+k+'\')">⚙️ 注文方法</button>'
     + '<button class="btn btn-out" ' + (on?'':'disabled') + ' onclick="ordDone(\''+k+'\')">✅ 発注済みにする</button></div>';
  h += '</div>';
  return h;
}

/* 1商品の行。チェック・不足・発注数量 */
function ordRow(it){
  const sh = shortOf(it), q = ordQty(it), pend = pendingOf(it.id);
  const u = unitOf(it);
  return '<div class="orow'+(ordOn(it)?'':' off')+'" id="or-'+it.id+'">'
    + '<button class="ock" onclick="ordToggle('+it.id+')">'+(ordOn(it)?'☑':'☐')+'</button>'
    + '<div class="ob">'
    +   '<b>'+esc(it.name)+'</b>'
    +   '<small>現在庫 '+fmtQ(it.stock)+u+'　／　不足 '
    +     (sh>0 ? '<b style="color:#c0392b">'+fmtQ(sh)+u+'</b>'
                : '0'+u+'（発注ラインちょうど）') + '</small>'
    +   (pend>0 ? '<small style="color:#c07d00;font-weight:700">⚠️ 未入荷の発注が '+fmtQ(pend)+u+' あります</small>' : '')
    +   '<div class="oq">'
    +     '<button onclick="ordStep('+it.id+',-0.1)">−0.1</button>'
    +     '<button onclick="ordStep('+it.id+',-1)">−1</button>'
    +     '<input id="oq-'+it.id+'" type="text" inputmode="decimal" value="'+fmtQ(q)+'" '
    +       'onchange="ordSetQty('+it.id+',this.value)">'
    +     '<span class="ou">'+esc(u)+'</span>'
    +     '<button onclick="ordStep('+it.id+',1)">＋1</button>'
    +     '<button onclick="ordStep('+it.id+',0.1)">＋0.1</button>'
    +   '</div>'
    + '</div></div>';
}

/* 未入荷の発注。二重発注に気づけるように、発注タブの下にいつも出す */
function ordPendingCard(){
  const rows = [];
  DB.items.forEach(it=>{ const p = pendingOf(it.id); if(p>0) rows.push({ it, p }); });
  if(!rows.length) return '';
  let h = '<div class="card gap"><h2>未入荷の発注（'+rows.length+'）</h2>'
        + '<div class="muted">発注したが、まだ入荷を記録していないぶんです。'
        + '届いたら「🚚入荷」で数を入れてください。</div><div class="gap">';
  rows.forEach(r=>{
    h += '<div class="hist"><span class="n">'+esc(r.it.name)+'</span>'
       + '<span class="r">'+fmtQ(r.p)+unitOf(r.it)+'</span></div>';
  });
  h += '</div></div>';
  return h;
}

/* ---------- 注文方法の設定 ---------- */
function ordSetup(key){
  const cfg = supCfg(key), k = esc(key).replace(/'/g,"\\'");
  openSheet('<h3>'+esc(supName(key))+'</h3><div class="sh-sub">注文のしかた</div>'
    + '<div class="chips" style="justify-content:center;margin-bottom:14px">'
    +   '<button class="'+(cfg.how==='line'?'on':'')+'" onclick="setSupHow(\''+k+'\',\'line\');ordSetup(\''+k+'\')">LINEで注文</button>'
    +   '<button class="'+(cfg.how==='app'?'on':'')+'" onclick="setSupHow(\''+k+'\',\'app\');ordSetup(\''+k+'\')">専用アプリ</button>'
    + '</div>'
    + (cfg.how==='app'
       ? '<label class="lab">注文サイトのURL（任意）</label>'
         + '<div class="muted" style="margin-bottom:8px">入れておくと「注文サイトを開く」が出ます。'
         + 'アプリの起動はこちらでは分からないので、ブラウザで開くだけです。</div>'
         + '<div class="hist"><span class="n">'+(cfg.url? esc(cfg.url) : '未登録')+'</span>'
         + '<button class="btn btn-gray btn-sm" onclick="askSupUrl(\''+k+'\')">変える</button></div>'
       : '')
    + '<button class="btn btn-gray gap" onclick="closeSheet()">閉じる</button>');
}

/* ---------- LINEの業者 ---------- */
function ordOpenLine(key){
  ORD.sheet = key; ORD.text = ordText(key);
  drawOrdLine();
}
function drawOrdLine(){
  const key = ORD.sheet, k = esc(key).replace(/'/g,"\\'");
  openSheet('<h3>'+esc(supName(key))+' への注文</h3>'
    + '<div class="sh-sub">送る前に直せます</div>'
    + '<textarea id="ord-t" style="min-height:220px" onchange="ORD.text=this.value">'+esc(ORD.text)+'</textarea>'
    + '<button class="btn btn-primary gap" onclick="ordShareLine()">📱 LINEで送る</button>'
    + '<div class="muted gap">LINEが開いて、送り先を自分で選ぶ形です。'
    + '送る相手はこちらでは指定できません。</div>'
    + '<button class="btn btn-out gap" onclick="ordCopy(\''+k+'\')">📋 注文文をコピー</button>'

}
/* LINEの公式なURLスキーム。開くとLINEが «誰に送るか» を聞いてくる。
   https://developers.line.biz/ja/docs/messaging-api/using-line-url-scheme/ */
function ordShareLine(){
  const el = document.getElementById('ord-t');
  if(el) ORD.text = el.value;
  const t = String(ORD.text || '').trim();
  if(!t){ toast('注文文が空です'); return; }
  try{
    window.location.href = 'https://line.me/R/share?text=' + encodeURIComponent(t);
  }catch(e){
    toast('LINEを開けませんでした。「注文文をコピー」を使ってください');
  }
}

/* ---------- 専用アプリの業者 ---------- */
function ordOpenApp(key){
  ORD.sheet = key; ORD.chk = {};
  drawOrdApp();
}
function ordChk(id){ if(ORD.chk[id]) delete ORD.chk[id]; else ORD.chk[id] = 1; drawOrdApp(); }
function drawOrdApp(){
  const key = ORD.sheet, k = esc(key).replace(/'/g,"\\'"), cfg = supCfg(key);
  const lines = ordLines(key);
  const n = lines.filter(l=>ORD.chk[l.it.id]).length;
  let h = '<h3>'+esc(supName(key))+' への注文</h3>'
        + '<div class="sh-sub">専用アプリに打ち込みながら確認してください（'+n+'/'+lines.length+'）</div>';
  lines.forEach(l=>{
    h += '<button class="chk'+(ORD.chk[l.it.id]?' on':'')+'" onclick="ordChk('+l.it.id+')">'
       +  '<span class="box">'+(ORD.chk[l.it.id]?'✓':'')+'</span>'
       +  '<span class="nm">'+esc(l.it.name)+'</span>'
       +  '<span class="now">'+qu(l.qty, l.it)+'</span></button>';
  });
  h += '<button class="btn btn-out gap" onclick="ordCopy(\''+k+'\',1)">📋 注文リストをコピー</button>'
     + (cfg.url ? '<a class="btn btn-dark gap" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(cfg.url)+'">🌐 注文サイトを開く</a>' : '')
     + '<div class="muted gap">専用アプリへの自動入力はできません。'
     + 'コピーした一覧を見ながら打ち込んでください。</div>'
     + '<button class="btn btn-gray gap" onclick="closeSheet()">閉じる</button>';
  openSheet(h);
}

/* ---------- コピー ---------- */
async function ordCopy(key, listOnly){
  const t = listOnly ? ordListText(key) : (ORD.sheet === key && ORD.text ? ORD.text : ordText(key));
  if(!t.trim()){ toast('注文するものがありません'); return; }
  try{
    if(!navigator.clipboard) throw new Error('no clipboard');
    await navigator.clipboard.writeText(t);
    toast('コピーしました');
  }catch(e){
    /* コピーできない端末・場面がある。そのときは枠に出して、長押しで取れるようにする */
    openSheet('<h3>コピーできませんでした</h3>'
      + '<div class="sh-sub">下の枠を長押しして、すべて選択してコピーしてください</div>'
      + '<textarea style="min-height:240px">'+esc(t)+'</textarea>'
      + '<button class="btn btn-gray gap" onclick="closeSheet()">閉じる</button>');
  }
}

/* ---------- 発注済みにする ---------- */
function ordDone(key){
  const lines = ordLines(key);
  if(!lines.length){ toast('注文する商品がありません'); return; }
  const body = lines.map(l=>'・'+l.it.name+'　'+qu(l.qty, l.it)).join('\n');
  if(!confirm(supName(key)+' に発注したことを記録します。\n\n'+body
            + '\n\n※ 在庫は増えません。届いたら「🚚入荷」で数を入れてください。')) return;
  const rec = { id: DB.seq++, at: nowISO(), sup: key, date: ORD.date || '',
                lines: lines.map(l=>({ itemId:l.it.id, name:l.it.name,
                                       qty:q1(l.qty), unit:unitOf(l.it), got:0 })) };
  DB.orders.unshift(rec);
  if(DB.orders.length > 200) DB.orders.length = 200;
  lines.forEach(l=>{ DB.ordered[l.it.id] = rec.at; delete ORD.qty[l.it.id]; });
  save(); closeSheet(); render();
  toast(lines.length + '商品を発注済みにしました');
}

function openArriveOne(id){
  const it = item(id);
  ADJ = { id, val:0 };
  openSheet('<h3>'+esc(it.name)+' の入荷</h3><div class="sh-sub">いまの在庫 '+it.stock+'</div>'
    + '<div class="bigqty"><button onclick="arrStep(-1)">－</button><span class="v" id="arr-v">'+ADJ.val+'</span>'
    + '<button onclick="arrStep(1)">＋</button></div>'
    + '<div class="two"><button class="btn btn-gray" onclick="closeSheet()">やめる</button>'
    + '<button class="btn btn-primary" onclick="arrSave()">入荷する</button></div>');
}
function arrStep(d){ ADJ.val = Math.max(0, ADJ.val + d); document.getElementById('arr-v').textContent = ADJ.val; }
function arrSave(){
  const it = item(ADJ.id);
  if(ADJ.val>0){ move(it, it.stock + ADJ.val, '入荷'); fillPending(it.id, ADJ.val); save(); toast(it.name+' +'+fmtQ(ADJ.val)); }
  closeSheet(); render();
}

/* ---------- ③ 入荷・棚卸 ---------- */
let ARR = { mode:'in', qty:{} };
function viewArrive(){
  let h = '<div class="pad">';
  h += '<div class="step" style="margin-bottom:14px">'
     +  '<div class="'+(ARR.mode==='in'?'on':'')+'" onclick="arrMode(\'in\')">🚚 入荷（増やす）</div>'
     +  '<div class="'+(ARR.mode==='count'?'on':'')+'" onclick="arrMode(\'count\')">🔢 棚卸（実在庫）</div>'
     + '</div>';
  h += '<div class="muted" style="margin-bottom:12px">'
     + (ARR.mode==='in' ? '届いた数を入れて、最後に「まとめて入荷」。複数商品を一度に登録できます。'
                        : (usedCats().length>1?'数えた':'冷凍庫を数えた')+'実際の数を入れて「まとめて反映」。差は履歴に残ります。')
     + '</div>';
  const cats = usedCats(), oneCat = cats.length <= 1;
  cats.forEach(c=>{
    const list = DB.items.filter(i=>(i.cat||CAT0)===c.k);
    if(!oneCat) h += '<div class="cath">'+c.ic+' '+c.name+'<span>'+list.length+'品</span></div>';
    list.forEach(it=>{
      const q = arrVal(it.id);
      h += '<div class="stp '+(arrOn(it.id)?'on':'')+'" id="stp-'+it.id+'">'
         +  '<span class="nm">'+esc(it.name)+'<span class="now">'+(ARR.mode==='in'?'在庫 ':'いま ')+it.stock
         +    (it.unit&&it.unit!=='個'? ' '+esc(it.unit) : '')+'</span></span>'
         +  '<button onclick="arrQ('+it.id+',-1)">－</button>'
         +  '<input id="q-'+it.id+'" type="text" inputmode="decimal" value="'+q+'" onchange="arrQset('+it.id+',this.value)">'
         +  '<button onclick="arrQ('+it.id+',1)">＋</button>'
         + '</div>';
    });
  });
  h += ARR.mode==='in'
     ? '<button class="btn btn-primary gap" id="arr-btn" '+(arrCount()?'':'disabled')+' onclick="arrCommit()">'+arrLabel()+'</button>'
     : '<button class="btn btn-dark gap" id="arr-btn" onclick="countCommit()">'+arrLabel()+'</button>';
  h += '</div>';
  return h;
}
function arrVal(id){
  const it = item(id);
  return ARR.qty[id]==null ? (ARR.mode==='in' ? 0 : it.stock) : ARR.qty[id];
}
function arrOn(id){
  const it = item(id), q = arrVal(id);
  return ARR.mode==='in' ? q>0 : q!==it.stock;
}
function arrCount(){ return DB.items.filter(i=>arrOn(i.id)).length; }
function arrLabel(){
  const n = arrCount();
  return ARR.mode==='in' ? ('まとめて入荷'+(n?'（'+n+'商品）':'')) : ('まとめて反映（棚卸）'+(n?'　'+n+'商品':''));
}
/* 行だけ描き直す（画面ごと作り直すと入力中の値が消えるため） */
function paintArr(id){
  const row = document.getElementById('stp-'+id), inp = document.getElementById('q-'+id);
  if(row) row.classList.toggle('on', arrOn(id));
  if(inp) inp.value = arrVal(id);
  const btn = document.getElementById('arr-btn');
  if(btn){ btn.textContent = arrLabel(); if(ARR.mode==='in') btn.disabled = !arrCount(); }
}
function goCount(){ go('arrive'); ARR = { mode:'count', qty:{} }; render(); }
function arrMode(m){ ARR = { mode:m, qty:{} }; render(); }
function arrQ(id,d){ ARR.qty[id] = Math.max(0, q1(arrVal(id) + d)); paintArr(id); }
function arrQset(id,v){ ARR.qty[id] = Math.max(0, q1(num(v))); paintArr(id); }
function arrCommit(){
  let n=0;
  DB.items.forEach(it=>{ const q = ARR.qty[it.id]||0; if(q>0){ move(it, it.stock+q, '入荷'); fillPending(it.id, q); n++; } });
  ARR.qty = {}; save(); render(); toast(n+'商品を入荷しました');
}
function countCommit(){
  let n=0;
  DB.items.forEach(it=>{ const q = ARR.qty[it.id]; if(q!=null && q!==it.stock){ move(it, q, '棚卸（数え直し）'); n++; } });
  ARR.qty = {}; save(); render(); toast(n? n+'商品を修正しました' : '変更はありません');
}

/* ============================================================
   POS連携
   ------------------------------------------------------------
   売上の取得は pos-source.js に切り出した（E-POSとの繋ぎ方が
   決まっていないため、取得方法だけ差し替えられるようにしてある）。
   このアプリは SaleRecord の形しか見ない：
     { key, at, day, ticket, posName, qty, amount }
   取得方法が CSV手動 → CSV自動 → API と変わっても、
   下の対応付け・二重取込よけ・在庫減算はそのまま使える。
   ============================================================ */
const CsvPosSource = KemuriPos.CsvManualSource;
const userErr      = KemuriPos.userErr;
/* 前回と同じ列構成のときに設定を引き継ぐための控えを渡す */
CsvPosSource.getColMemo = () => DB.csvMap;
function guessCols(head){ return CsvPosSource.guessCols(head); }

/* ---------- POS画面（3ステップ） ---------- */
let POS = { step:1, parsed:null, sales:null, period:{ from:'', to:'' }, showAll:false, noStock:false };
/* 日付まわりは kemuri-core.js に、CSVの期間読み取りは pos-source.js にまとめた */
function todayStr(){ return KemuriCore.todayStr(); }
function nextDay(d){ return KemuriCore.nextDay(d); }
function prevDay(d){ return KemuriCore.prevDay(d); }
/* CSVの「抽出期間：2026-09-01～2026-09-15」から期間を読み取る */
function periodFromRows(rows, headIdx){ return CsvPosSource.periodFromRows(rows, headIdx); }
function lastImport(){ return DB.imports.find(r=>!r.undone && r.period && r.period.to); }
/* 前回と同じ月なら同じ開始日を引き継ぐ（POSの「当月」で書き出す運用に合わせる） */
function defaultPeriod(){
  const t = todayStr(), m = t.slice(0,7);
  const last = DB.imports.find(r=>!r.undone && r.period && r.period.from);
  if(last && last.period.from.slice(0,7) === m) return { from:last.period.from, to:t };
  return { from:m+'-01', to:t };
}
function needPeriod(){ const c = POS.parsed.cols; return c.at<0 && c.ticket<0; }
const LONG_SPAN = 31;         // これより長い期間は「過去ぶんの取込」とみなす
/* 取り込もうとしている期間の長さ（日）。分からなければ0 */
function spanDays(){
  const days = {};
  (POS.sales||[]).forEach(s=>{ const d = s.day || dayOf(s.at); if(d) days[d]=1; });
  const ds = Object.keys(days).sort();
  const from = (POS.period && POS.period.from) || ds[0] || '';
  const to   = (POS.period && POS.period.to)   || ds[ds.length-1] || '';
  if(!from || !to) return 0;
  const a = new Date(from+'T00:00:00'), b = new Date(to+'T00:00:00');
  if(isNaN(a) || isNaN(b)) return 0;
  return Math.round((b - a) / 86400000) + 1;
}

/* 日別売上のCSV（日付・天気・総売上・客計…）を、ここで取り込もうとしていないか。
   このCSVには商品名の列が無いので、日付が商品名として登録されてしまう。
   （実際に「09月23日(水) 出数1」が商品として並んだことがある）
   見出しに客計/組計/総売上があるか、商品名の列が日付ばかりかで見分ける。 */
function looksDaily(){
  const p = POS.parsed;
  if(!p) return null;
  const head = (p.headIdx>=0 ? p.rows[p.headIdx] : []).map(c=>norm(c)).join('|');
  const byHead = /客計|組計|客単価|組単価|総売上/.test(head);

  let byName = false;
  const rows = p.rows.slice(Math.max(p.headIdx,0)+1, Math.max(p.headIdx,0)+21);
  if(p.cols.name>=0 && rows.length){
    /* 「09月23日(水)」「2026/09/23」のような書き方 */
    const isDate = v => /^\s*\d{1,4}\s*[年月\/\-\.]\s*\d{1,2}\s*[月日\/\-\.]?/.test(String(v==null?'':v));
    const vals = rows.map(r=>r[p.cols.name]).filter(v=>String(v==null?'':v).trim()!=='');
    if(vals.length >= 3) byName = vals.filter(isDate).length / vals.length >= 0.6;
  }
  if(!byHead && !byName) return null;
  return { byHead, byName };
}
function dailyWarnBox(){
  const d = looksDaily();
  if(!d) return '';
  return '<div class="warn gap">⚠️ <b>これは「日別の売上」のCSVではありませんか？</b><br>'
       + (d.byHead ? '見出しに「客計」「組計」「総売上」があります。' : '')
       + (d.byName ? '商品名の列に日付が並んでいます。' : '')
       + '<br>このCSVには<b>商品名が入っていない</b>ので、このまま進めると'
       + '<b>日付が商品として登録されます</b>（例：「09月23日(水)」出数1）。'
       + '<br><br>日別の売上は、<b>ダッシュボードの📊売上タブ</b>で取り込んでください。'
       + '<br><a href="dashboard.html" style="color:#8a6100;font-weight:700">ダッシュボードをひらく →</a></div>';
}
/* ============================================================

/* ファイルから読む。何枚でもまとめて読み、日付でひとつにする */
async function onPickDaily(el){
  const fs = [].slice.call(el.files || []); el.value = '';
  if(!fs.length) return;
  DAY.open = true; DAY.err = ''; DAY.res = null; DAY.files = [];
  const rows = {}, bad = [];
  let any = null;
  for(const f of fs){
    let text = '';
    try{ text = await KemuriPos.decodeFile(f); }
    catch(e){ bad.push(f.name + '（読めません）'); continue; }
    if(text.slice(0,2) === 'PK'){ bad.push(f.name + '（エクセル形式）'); continue; }
    let r = null;
    try{ r = KemuriData.dailyFromCsv(text); }catch(e){}
    if(!r || !r.headerFound || !r.rows.length){ bad.push(f.name + '（日別の売上表として読めません）'); continue; }
    DAY.files.push(f.name);
    if(fs.length === 1) DAY.text = text;        /* 1枚なら枠にも出して、何を読んだか見えるように */
    /* 同じ日が何枚かに出てきたら、あとから読んだほうを採る */
    r.rows.forEach(x=>{ rows[x.day] = x; });
    any = any || r;
  }
  const list = Object.keys(rows).sort().map(d=>rows[d]);
  if(!list.length){
    DAY.err = bad.length ? ('取り込めませんでした：<br>'+bad.map(esc).join('<br>'))
                         : '日別の売上表として読めませんでした。「日付」と「総売上」または「客計」の列があるCSVを選んでください。'
                         + '（商品名と出数が並んでいるCSVは、上の「商品別」のほうで取り込みます）';
    render(); return;
  }
  /* 曜日の一致は «何枚目の» 話なのか分からなくなるので、何枚も読んだときは出さない。
     年の推測だけは、ずれていると全部ずれるので必ず知らせる。 */
  DAY.res = { rows:list, from:list[0].day, to:list[list.length-1].day,
              year:(any && any.yearGuessed) ? any.year : null,
              matched:(DAY.files.length===1 && any) ? any.matched : null,
              checked:(DAY.files.length===1 && any) ? any.checked : null };
  if(bad.length) DAY.err = '読めなかったファイル：<br>' + bad.map(esc).join('<br>');
  render();
}
/* 貼り付けから読む */
function readDailyCsv(){
  const el = document.getElementById('dcsv');
  DAY.text = el ? el.value : '';
  DAY.err = ''; DAY.res = null; DAY.files = [];
  if(!DAY.text.trim()){ DAY.err = 'CSVを貼り付けてください。'; render(); return; }
  let r = null;
  try{ r = KemuriData.dailyFromCsv(DAY.text); }catch(e){}
  if(!r || !r.headerFound){
    DAY.err = '日別の売上表として読めませんでした。「日付」と「総売上」または「客計」の列があるCSVを入れてください。'
            + '（商品名と出数が並んでいるCSVは、上の「商品別」のほうで取り込みます）';
  }else if(!r.rows.length){
    DAY.err = '日付の行が見つかりませんでした。';
  }else{
    const list = r.rows.slice().sort((a,b)=>a.day.localeCompare(b.day));
    DAY.res = { rows:list, from:list[0].day, to:list[list.length-1].day,
                year:r.yearGuessed ? r.year : null, matched:r.matched, checked:r.checked };
  }
  render();
}
function saveDailyCsv(){
  const r = DAY.res;
  if(!r || !r.rows.length) return;
  const res = KemuriData.daily.importRows(r.rows);
  DAY = { open:false, text:'', res:null, err:'', files:[] };
  render();
  toast(res.added + '日ぶんを登録しました' + (res.updated ? '（' + res.updated + '日ぶんは上書き）' : ''));
}

    h += '<label class="lab">ヘッダー行</label>'
       + '<select class="sel" onchange="posHead(this.value)">'

             '<option value="'+i+'" '+(i===p.headIdx?'selected':'')+'>'+(i+1)+'行目：'+esc(r.slice(0,4).join(' / ').slice(0,40))+'</option>').join('')
       + '</select>';
    h += '<label class="lab">商品名の列（必須）</label><select class="sel" onchange="posCol(\'name\',this.value)">'+opts(p.cols.name)+'</select>';
    h += '<label class="lab">販売数の列</label><select class="sel" onchange="posCol(\'qty\',this.value)">'+opts(p.cols.qty)+'</select>';

  }
  const ov = needPeriod() && POS.period && POS.period.from ? DB.imports.find(r=>!r.undone && r.period && r.period.from

  /* 過去ぶんをまとめて取り込むときは、在庫を動かさずに売上だけ残したい。

    h += '<div class="info">今回、在庫から引くものはありません。</div>';
  }

  if(pv.unknown.length && !POS.noStock){
    const un = pv.unknown.slice().sort((a,b)=>b.qty-a.qty);
    const sug = un.filter(u=>u.suggest), rest = un.filter(u=>!u.suggest);
    const opts = u => '<select class="sel" onchange="setMap(this.value,\''+escArg(u.name)+'\')">'
         +   '<option value="">在庫商品を選ぶ…</option>'
         +   DB.items.map(i=>'<option value="'+i.id+'">'+esc(i.name)+'</option>').join('')
         +   '<option value="__skip__">この商品は使わない（在庫なし）</option>'
         + '</select>';

    if(sug.length){
      h += '<div class="warn gap">冷凍在庫らしい商品が '+sug.length+' 件あります。'
         + 'ボタンを押すと対応づけて、次回から自動で在庫を引きます。</div><div class="gap">';
      sug.forEach(u=>{
        h += '<div class="map-row"><div class="nm">'+esc(u.name)+'<span class="sl" style="font-weight:400;color:#888"> 　出数 '+u.qty+'</span></div>'
           + '<button class="btn btn-primary" style="padding:13px;font-size:16px;margin-bottom:8px" '
           +   'onclick="setMap(\''+u.suggest.id+'\',\''+escArg(u.name)+'\')">「'+esc(u.suggest.name)+'」に対応づける</button>'
           + opts(u) + '</div>';
      });
      h += '</div>';
    }
    if(rest.length){
      const shown = POS.showAll ? rest : rest.slice(0,8);
      h += '<div class="muted gap" style="font-weight:700">その他 '+rest.length+' 件（ドリンク・コース・たれ／塩など）</div>'
         + '<div class="muted">冷凍在庫にあるものだけ選んでください。盛り合わせ・コース・飲み放題は「使わない」でOKです。</div><div class="gap">';
      shown.forEach(u=>{
        h += '<div class="map-row"><div class="nm">'+esc(u.name)+'<span class="sl" style="font-weight:400;color:#888"> 　出数 '+u.qty+'</span></div>'
           + opts(u) + '</div>';
      });
      h += '</div>';
      if(rest.length > shown.length)
        h += '<button class="btn btn-out gap" onclick="POS.showAll=true;render()">残り '+(rest.length-shown.length)+' 件も表示する</button>';
    }
    h += '<button class="btn btn-gray gap" onclick="skipAllUnknown()">未対応の '+(POS.showAll||!rest.length? un.length : rest.length)
       + ' 件をまとめて「使わない」にする</button>';
  }
  h += dailyWarnBox();
  const canGo = (POS.noStock ? POS.sales.length : pv.lines.length) && !looksDaily();
  h += '<button class="btn btn-primary gap" '+(canGo?'':'disabled')+' onclick="posApply()">'
     + (POS.noStock ? '売上だけ取り込む（在庫は動かさない）' : '在庫に反映する') + '</button>';
  h += '<button class="btn btn-gray gap" onclick="POS.step=2;render()">列の設定を見直す</button>';
  h += '</div>';
  return h;
}

async function onPickFile(el){
  const f = el.files && el.files[0]; el.value = '';
  if(!f) return;
  try{ startImport(await CsvPosSource.read(f)); }
  catch(e){ toast((e && e.userMsg) || 'CSVを読めませんでした'); }
}
function pasteImport(){
  const el = document.getElementById('paste');
  const v = el && el.value.trim();
  if(!v){ toast('CSVの中身を貼り付けてください'); return; }
  try{ startImport(CsvPosSource.fromText(v, '貼り付けた売上')); }
  catch(e){ toast((e && e.userMsg) || '読み取れませんでした'); }
}
/* 読み取れたら、列が分かっている限り確認画面を飛ばしてプレビューまで一気に進む */
function startImport(parsed){
  POS.parsed = parsed;
  POS.period = periodFromRows(parsed.rows, parsed.headIdx) || defaultPeriod();
  POS.showAll = false;
  TAB = 'pos';
  const c = parsed.cols;
  if(c.name>=0 && c.qty>=0) posPreview();
  else { POS.step = 2; render(); }
}
function posReset(){ POS = { step:1, parsed:null, sales:null, period:{ from:'', to:'' }, showAll:false, noStock:false }; render(); }
function posHead(i){
  POS.parsed.headIdx = parseInt(i,10);
  POS.parsed.cols = guessCols(POS.parsed.rows[POS.parsed.headIdx]);
  setTimeout(render, 0);
}
function posCol(k,v){ POS.parsed.cols[k] = parseInt(v,10); setTimeout(render, 0); }
/* プレビューで期間を直したら、二重取込よけのキーを作り直す */
function setPeriod(k, v){
  POS.period[k] = v; POS.period.auto = false;
  POS.sales = CsvPosSource.toSales(POS.parsed, POS.period);
  setTimeout(render, 0);
}
function posPreview(){
  const p = POS.parsed;
  if(p.cols.name<0){ toast('商品名の列を選んでください'); return; }
  if(needPeriod() && !POS.period.from){ toast('集計の期間（開始日）を入れてください'); return; }
  if(p.headIdx >= 0)   /* 見出しがあるCSVだけ、列の対応を次回のために覚えておく */
    DB.csvMap = { sig: p.rows[p.headIdx].map(c=>norm(c)).join('|'), cols: Object.assign({},p.cols) };
  save();
  POS.sales = CsvPosSource.toSales(p, POS.period);
  if(!POS.sales.length){ toast('売上の行が見つかりませんでした'); return; }
  /* 長い期間をまとめて取り込むのは、たいてい «過去ぶんを分析用に入れる» ので、
     はじめから在庫を動かさない側にしておく。毎日の締めは1〜数日なので影響しない。
     チェックは自分で外せる（外せば今までどおり引く）。 */
  if(spanDays() > LONG_SPAN) POS.noStock = true;
  POS.step = 3; render();
}

/* SaleRecord[] → 反映プレビュー */
/* 取込プレビュー
   ・明細形式（伝票番号あり）… 売上1行ずつをキーにして取込済みなら引かない
   ・集計形式（伝票番号なし）… 「日付×商品」ごとに、すでに引いた数との差だけ引く
     （同じ日を何度書き出し直しても、増えたぶんだけ正しく引ける）        */
function buildPreview(sales){
  const byItem = {}, unknown = {}, seenInFile = {}, sums = {}, skipSums = [];
  let newRows = 0, dupRows = 0, sumMode = false, noKey = false;
  /* auto … この分類はPOSから自動で在庫を引くか。引かない分類は数えるだけで在庫は動かさない */
  const bucket = it => byItem[it.id] = byItem[it.id] ||
        { id:it.id, name:it.name, per:it.per||1, qty:0, use:0, from:[], recipe:false,
          keys:[], sums:[], auto:autoPos(it) };
  const unk = s => (unknown[s.posName] = unknown[s.posName] || { name:s.posName, qty:0 }).qty += s.qty;
  /* 1つのメニューが、どの在庫をいくつ使うかを «使う量» で積む。
     レシピがあれば材料ごとに分かれる（サラダ → レタス・トマト…）。 */
  const put = (posName, qty, onBucket)=>{
    const us = usesFor(posName);
    if(!us.length) return false;
    const many = us.length > 1 || !!recipeOf(posName);
    us.forEach(u=>{
      const b = bucket(u.it);
      b.qty += qty;
      b.use += qty * u.per;
      if(many){ b.recipe = true; b.from.push({ name:posName, qty, use: qty * u.per }); }
      if(onBucket) onBucket(b);
    });
    return true;
  };

  sales.forEach(s=>{
    const m = lookup(s.posName);
    /* 対応表で «使わない» にしてあるものは、レシピがあっても引かない */
    const skip = m && m.item === '__skip__';
    if(!m && !recipeOf(s.posName)){ unk(s); return; }
    if(s.ticket){                                   /* 明細形式 */
      if(DB.seen[s.key] || seenInFile[s.key]){ dupRows++; return; }
      seenInFile[s.key] = 1; newRows++;
      if(skip) return;
      if(!put(s.posName, s.qty, b=>b.keys.push(s.key))) unk(s);
    }else{                                          /* 集計形式 */
      sumMode = true;
      if(!s.day) noKey = true;
      const k = 'S\u0001'+s.day+'\u0001'+norm(s.posName);
      const g = sums[k] = sums[k] || { key:k, posName:s.posName, qty:0, skip:skip };
      g.qty += s.qty;
    }
  });

  Object.values(sums).forEach(g=>{
    const done = DB.applied[g.key] || 0;
    const delta = g.qty - done;
    if(delta <= 0){ dupRows++; return; }
    newRows++;
    if(g.skip){ skipSums.push({ key:g.key, total:g.qty }); return; }
    if(!put(g.posName, delta, b=>b.sums.push({ key:g.key, total:g.qty }))){
      unk({ posName:g.posName, qty:delta });
    }
  });

  const r1 = x => Math.round(x * 10) / 10;
  const lines = Object.values(byItem)
                 .map(b=>Object.assign(b, { use: r1(b.use), move: b.auto ? -r1(b.use) : 0 }))
                 .sort((a,b)=>a.move-b.move);
  const un = Object.values(unknown).map(u=>Object.assign(u, { suggest: suggestItem(u.name) }));
  return { lines, unknown:un, newRows, dupRows, sumMode, noKey, skipSums };
}
/* 在庫に関係ない商品（ドリンク・コースなど）をまとめて「使わない」に */
function skipAllUnknown(){
  const all = buildPreview(POS.sales).unknown;
  const rest = all.filter(u=>!u.suggest);
  const un = (POS.showAll || !rest.length) ? all : rest;   // 候補が出ているものは残す
  if(!un.length) return;
  if(!confirm(un.length+'件を「使わない」に設定します。\n（設定タブでやり直せます）')) return;
  un.forEach(u=>{ DB.map[norm(u.name)] = { item:'__skip__', label:u.name }; });
  save(); render(); toast(un.length+'件を「使わない」にしました');
}
function setMap(v, name){
  if(!v) return;
  DB.map[norm(name)] = { item: v==='__skip__' ? '__skip__' : parseInt(v,10), label:name };
  save(); setTimeout(render, 0);
}
function posApply(){
  const pv = buildPreview(POS.sales);
  const pr = POS.period || { from:'', to:'' };
  const rec = { id:DB.seq++, at:nowISO(), file:POS.parsed.file, period:{ from:pr.from, to:pr.to },
                rows:0, lines:[], keys:[], applied:[], undone:false };
  const markSum = a=>{ rec.applied.push({ key:a.key, prev:DB.applied[a.key]||0, total:a.total }); DB.applied[a.key] = a.total; };
  const noStock = !!POS.noStock;
  rec.noStock = noStock;
  pv.lines.forEach(l=>{
    const it = item(l.id); if(!it) return;
    const amount = l.use;                     /* レシピ換算ずみの «使う量» */
    /* 「POSから自動で引かない」分類（乾物・調味料、備品）は在庫を動かさない。
       売れた数は記録するが、減り方は棚卸で合わせる。 */
    const auto = autoPos(it);
    /* 在庫を動かさないモードでは move しない。rec.lines にも入れない
       （取消したときに、引いていないぶんを戻してしまわないように）。
       取込済みの印は付ける＝同じCSVを入れ直しても二重にならない。 */
    if(!noStock && auto){
      /* 在庫は0で止まる（マイナスにしない）ので、«引こうとした量» と
         «実際に引けた量» がずれることがある。取消で戻すのは実際に引けたぶん。
         引こうとした量を戻すと、在庫が元より増えてしまう。 */
      const had = it.stock;
      move(it, it.stock - amount, 'POS売上（'+l.qty+'個）');
      const took = Math.round((had - it.stock) * 10) / 10;
      if(took > 0) rec.lines.push({ itemId:it.id, qty:took });
    }
    l.keys.forEach(k=>{ DB.seen[k] = 1; rec.keys.push(k); });
    l.sums.forEach(markSum);
  });
  pv.skipSums.forEach(markSum);
  /* 「使わない」に設定済みの行も取込済みにしておく（毎回出てこないように） */
  POS.sales.forEach(s=>{
    const m = lookup(s.posName);
    if(m && m.item==='__skip__' && !DB.seen[s.key]){ DB.seen[s.key]=1; rec.keys.push(s.key); }
    /* 「揚物/ポテトフライ」のような書き方で対応できたものは、そのままの名前も登録して次回を速く */
    if(m && !DB.map[norm(s.posName)]) DB.map[norm(s.posName)] = { item:m.item, label:s.posName };
  });
  rec.rows = rec.keys.length + rec.applied.length;
  /* 売上そのものを履歴にためる（翌日の予測・売れ筋・原価率の土台になる）。
     在庫に関係ない商品（ドリンク・コースなど）も、売上分析に要るので全部ためる。
     ためる側で二重防止をやっているので、同じCSVを入れ直しても増えない。 */
  let salesWarn = '';
  try{
    const sres = KemuriCore.sales.record(POS.sales, rec.id, POS.period);
    /* 端末の保存容量がいっぱいだと、売上履歴だけ残せないことがある。
       在庫は反映できているので止めはしないが、黙って消えると
       「取り込んだのに売上に出ない」になるので必ず知らせる。 */
    if(sres && sres.saved === false) salesWarn = '在庫は反映しましたが、端末の空きが足りず売上履歴を残せませんでした。設定から古い売上を減らしてください。';
  }
  catch(e){ /* 履歴に失敗しても在庫の反映は止めない */ }
  DB.imports.unshift(rec);
  if(DB.imports.length>30) DB.imports.length = 30;
  pruneSeen();
  save();
  const n = noStock ? POS.sales.length : rec.lines.length;
  POS = { step:1, parsed:null, sales:null, period:{ from:'', to:'' }, showAll:false, noStock:false };
  render(); toast(salesWarn || (noStock ? ('売上 '+n+'行を記録しました（在庫は動かしていません）')
                                           : (n+'商品の在庫に反映しました')));
  if(salesWarn) alert(salesWarn);
  go(noStock ? 'pos' : 'stock');
}
/* seenが増えすぎないように、古い取込のキーから捨てる */
function pruneSeen(){
  if(Object.keys(DB.seen).length > 30000){
    const keep = {};
    DB.imports.slice(0,10).forEach(r=>r.keys.forEach(k=>keep[k]=1));
    DB.seen = keep;
  }
  if(Object.keys(DB.applied).length > 20000){
    const keep = {};
    DB.imports.slice(0,10).forEach(r=>(r.applied||[]).forEach(a=>keep[a.key]=DB.applied[a.key]));
    DB.applied = keep;
  }
}
function undoImport(id){
  const rec = DB.imports.find(r=>r.id===id);
  if(!rec || rec.undone) return;
  if(!confirm('この取込を取り消して、引いた在庫を戻しますか？')) return;
  rec.lines.forEach(l=>{ const it = item(l.itemId); if(it) move(it, it.stock + l.qty, 'POS取込の取消'); });
  rec.keys.forEach(k=>{ delete DB.seen[k]; });
  (rec.applied||[]).forEach(a=>{ if(a.prev) DB.applied[a.key] = a.prev; else delete DB.applied[a.key]; });
  /* 売上履歴からも同じぶんを戻す。ここが失敗すると在庫だけ戻って
     ダッシュボードには売上が残る＝「取り消したのに消えない」になるので、
     黙って飲み込まずに知らせる。 */
  let salesLeft = false;
  try{ if(KemuriCore.sales.undo(rec.id) !== true) salesLeft = true; }
  catch(e){ salesLeft = true; }
  rec.undone = true;
  save(); render();
  if(salesLeft){
    toast('在庫は戻しましたが、売上の記録は残っています');
    alert('在庫は戻しました。\n\nただし、この取込ぶんの売上の記録は戻せませんでした'
        + '（取消の控えが古くなって残っていないときに起きます）。\n\n'
        + 'ダッシュボードの⚙️設定タブ →「入れ直したいとき」から'
        + '「商品ごとの売上を消す」を押して、CSVを入れ直してください。\n'
        + '在庫の数は変わりません。');
  }else{
    toast('取込を取り消しました');
  }
}

function posNamesOf(id){ return Object.entries(DB.map).filter(([k,m])=>m.item===id).map(([k,m])=>m.label||k); }
/* ============================================================
   POS商品名の対応表
   ------------------------------------------------------------
   «使わない» にした商品を、あとから戻せるようにしておく。
   取り込みのときに «在庫に関係ないもの» をまとめて «使わない» に
   できるので、そこでドリンクごと流してしまうことがある。あとで
   ドリンクを在庫で見たくなったとき、500件の一覧から1つずつ探す
   のは現実的でないため、絞り込みとまとめ解除を用意する。
   ============================================================ */
let MAPQ = { f:'all', q:'', more:0 };
const MAP_PAGE = 50;

function mapRows(){
  const q = loose(MAPQ.q);
  return Object.entries(DB.map).filter(([k,m])=>{
    if(MAPQ.f==='skip' && m.item!=='__skip__') return false;
    if(MAPQ.f==='on'   && m.item==='__skip__') return false;
    if(q && loose(m.label||k).indexOf(q) < 0) return false;
    return true;
  });
}
function mapFilter(f){ MAPQ.f = f; MAPQ.more = 0; render(); }
function mapSearch(v){ MAPQ.q = v; MAPQ.more = 0; drawMapList(); }
function mapMore(){ MAPQ.more += MAP_PAGE; drawMapList(); }
/* 一覧だけ描き直す。全体を描き直すと検索欄のカーソルが飛ぶため */
function drawMapList(){
  const el = document.getElementById('maplist');
  if(el) el.innerHTML = mapListHtml();
}
function mapListHtml(){
  const rows = mapRows();
  const show = rows.slice(0, MAP_PAGE + MAPQ.more);
  let h = '';
  if(!rows.length){
    h += '<div class="muted">' + (MAPQ.q ? '見つかりませんでした。' : 'まだありません。') + '</div>';
  }
  show.forEach(([k,m])=>{
    const skip = m.item === '__skip__';
    const target = skip ? '（使わない）' : (item(m.item) ? item(m.item).name : '？');
    h += '<div class="hist"><span class="n">'+esc(m.label||k)+'</span>'
       + '<span class="r" style="'+(skip?'color:#c0392b':'')+'">→ '+esc(target)+'</span>'
       + '<button class="btn btn-danger btn-sm" style="padding:6px 10px;font-size:12px" '
       +   'onclick="delMap(\'' + esc(k).replace(/'/g,"\\'") + '\')">解除</button></div>';
  });
  if(rows.length > show.length){
    h += '<button class="btn btn-out gap" onclick="mapMore()">あと '
       + (rows.length - show.length) + ' 件を見る</button>';
  }
  if(rows.length){
    h += '<button class="btn btn-danger gap" onclick="mapClear()">いま出ている '
       + rows.length + ' 件をまとめて解除</button>';
  }
  return h;
}
/* 解除＝対応表から消すだけ。次の取り込みで «在庫に紐づいていない商品» に
   また出てくるので、そこで在庫商品を選べる。売上の数字は何も変わらない。 */
function mapClear(){
  const rows = mapRows();
  if(!rows.length) return;
  if(!confirm(rows.length + '件の対応を解除します。\n\n'
            + '売上の数字は変わりません。次の取り込みのときに\n'
            + '「在庫に紐づいていない商品」としてまた出てくるので、\n'
            + 'そこで在庫商品を選びなおせます。')) return;
  rows.forEach(([k])=>{ delete DB.map[k]; });
  save(); render(); toast(rows.length + '件を解除しました');
}

/* ============================================================
   リストからまとめて登録
   ------------------------------------------------------------
   1行1品。区切りはタブでもカンマでもよい。
     品名 , 分類 , 仕入先 , 単位 , 発注ライン
   分類より後ろは省略できて、省略したぶんは «前の行と同じ» になる。
   紙に「ドリンク／酒屋さん」と一度書いてから品名を並べる、という
   ふだんの書き方がそのまま通るようにするため。
   ============================================================ */
/* 「ドリンク」「飲料」「酒」…のような書き方から分類を当てる */
const CAT_WORDS = {
  frozen:['冷凍','れいとう','フローズン'],
  fresh :['生鮮','せいせん','野菜','肉','魚','鮮魚','青果'],
  drink :['ドリンク','どりんく','飲料','酒','ドリンクー','飲み物'],
  dry   :['乾物','調味料','乾物・調味料','乾燥','だし','出汁'],
  misc  :['備品','消耗品','雑貨','その他']
};
function catFromWord(w){
  const t = norm(w);
  if(!t) return '';
  for(const c of CATS){ if(norm(c.name) === t) return c.k; }
  for(const k in CAT_WORDS){ if(CAT_WORDS[k].some(x=>norm(x) === t)) return k; }
  for(const k in CAT_WORDS){ if(CAT_WORDS[k].some(x=>t.indexOf(norm(x)) >= 0)) return k; }
  return '';
}
function parseItemList(text){
  const rows = [];
  /* 前の行から引き継ぐぶん。何も書かれていないうちは、いま覚えている初期値から */
  const L = DB.last || {};
  let cur = { cat:L.cat||CAT0, sup:L.sup||'', unit:L.unit||'個', min:3 };
  const names = {};                      /* このリストの中での重複も見る */
  String(text||'').split(/\r?\n/).forEach((line, i)=>{
    const raw = line.trim();
    if(!raw || /^([#＃]|\/\/)/.test(raw)) return;          /* 空行とメモ行は飛ばす */
    const f = (raw.indexOf('\t') >= 0 ? raw.split('\t') : raw.split(/[,、，]/)).map(x=>x.trim());
    const name = f[0];
    if(!name) return;
    if(i === 0 && /^(品名|商品名|名前)$/.test(name)) return;  /* 見出し行 */

    const r = { line:i+1, name, note:'' };
    if(f[1]){
      const k = catFromWord(f[1]);
      if(!k){ r.bad = '「'+f[1]+'」がどの分類か分かりません'; rows.push(r); return; }
      cur.cat = k;
    }
    if(f[2]) cur.sup  = f[2];
    if(f[3]) cur.unit = f[3];
    if(f[4] !== undefined && f[4] !== '') cur.min = Math.max(0, q1(num(f[4])));

    r.cat = cur.cat; r.sup = cur.sup; r.unit = cur.unit; r.min = cur.min;
    const k = norm(name);
    if(DB.items.some(it=>norm(it.name) === k)) r.dup = 'すでにあります';
    else if(names[k]) r.dup = 'リストの中で重複';
    names[k] = 1;
    rows.push(r);
  });
  return rows;
}

  h += '<div class="'+(add.length?'info':'note')+'">'

     +   (dup.length ? '<br>'+dup.length+' 品は<b>すでにあるので飛ばします</b>。' : '')
     +   (bad.length ? '<br><b>'+bad.length+' 行は読めませんでした。</b>この行は登録しません。' : '')

  if(bad.length){
    h += '<div class="sec">読めなかった行</div>';
    bad.forEach(r=>{
      h += '<div class="prev"><span class="nm">'+r.line+'行目　'+esc(r.name)+'</span>'

    list.forEach(r=>{

         + '<span class="sl">'+(r.sup? esc(r.sup)+'　':'')+'ライン '+r.min
         +   (r.unit && r.unit!=='個' ? ' '+esc(r.unit) : '')+'</span></div>';

  h += '<div class="two"><button class="btn btn-gray" onclick="BULK.rows=null;drawBulk()">戻って直す</button>'
     + '<button class="btn btn-primary" '+(add.length?'':'disabled')
     +   ' onclick="bulkApply()">この内容で登録する</button></div>';

function bulkRead(){
  const el = document.getElementById('bulk-t');
  if(el) BULK.text = el.value;
  const rows = parseItemList(BULK.text);
  if(!rows.length){ toast('読み取れる行がありませんでした'); return; }
  BULK.rows = rows;
  drawBulk();
}
function bulkApply(){
  const add = BULK.rows.filter(r=>!r.bad && !r.dup);
  if(!add.length) return;
  add.forEach(r=>{
    const id = DB.seq++;
    DB.items.push({ id, name:r.name, stock:0, min:r.min, per:1, cost:0,
                    cat:r.cat, sup:r.sup, unit:r.unit });
    if(cat(r.cat).pos) DB.map[norm(r.name)] = { item:id, label:r.name };
    addSup(r.sup);
  });
  const last = add[add.length-1];
  DB.last = { cat:last.cat, sup:last.sup, unit:last.unit };
  save(); closeSheet(); render();
  toast(add.length + ' 品を登録しました');
}

/* 入れた仕入先を候補に覚えておく（次から選ぶだけで済むように） */
function addSup(name){
  const v = String(name||'').trim();
  if(!v) return;
  DB.sups = DB.sups || [];
  if(DB.sups.indexOf(v) < 0){ DB.sups.push(v); DB.sups.sort((a,b)=>a.localeCompare(b,'ja')); }
}
function delItem(){
  if(!confirm('「'+item(EDIT.id).name+'」を削除しますか？')) return;
  DB.items = DB.items.filter(i=>i.id!==EDIT.id);
  Object.keys(DB.map).forEach(k=>{ if(DB.map[k].item===EDIT.id) delete DB.map[k]; });
  delete DB.ordered[EDIT.id];
  save(); closeSheet(); render(); toast('削除しました');
}

/* ============================================================
   バックアップ
   ------------------------------------------------------------
   在庫アプリだけでなく、売上履歴・日別売上・原価・レシピもまとめて
   持ち出す（中身は kemuri-backup.js）。iPhoneでホーム画面に追加した
   アプリは Safari とも Chrome とも別の入れ物なので、ここが消えると
   268日ぶんの売上も原価も戻らない。
   ============================================================ */
function bkBlob(){
  return new Blob([KemuriBackup.text()], { type:'application/json' });
}
/* ファイルとして保存する。ダウンロードが効かない環境では «送る» に回す */
function bkSave(){
  try{
    const url = URL.createObjectURL(bkBlob());
    const a = document.createElement('a');
    a.href = url; a.download = KemuriBackup.filename();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('保存しました（' + KemuriBackup.filename() + '）');
  }catch(e){
    toast('保存できませんでした。「送る」を試してください');
  }
}
/* iPhoneの共有シートに出す。LINEやメモ、ファイルアプリに渡せる */
async function bkShare(){
  const name = KemuriBackup.filename();
  try{
    const file = new File([bkBlob()], name, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'串焼KEMURI屋 バックアップ' });
      return;
    }
    await navigator.share({ title:name, text:KemuriBackup.text() });
  }catch(e){
    if(e && e.name === 'AbortError') return;          // 自分でやめただけ
    toast('送れませんでした。「文字でコピーする」を試してください');
  }
}
async function bkCopy(){
  const t = KemuriBackup.text();
  try{
    await navigator.clipboard.writeText(t);
    toast('コピーしました（' + Math.round(t.length/1024) + ' KB）');
  }catch(e){
    const el = document.getElementById('io');
    if(el){ el.value = t; el.focus(); el.select(); toast('下の枠に出しました。長押しでコピーしてください'); }
    else toast('コピーできませんでした');
  }
}
/* ファイルから戻す */
function bkPick(el){
  const f = el.files && el.files[0];
  el.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=> bkRestore(String(r.result||''), f.name);
  r.onerror = ()=> toast('ファイルを読めませんでした');
  r.readAsText(f);
}
function impData(){ bkRestore(document.getElementById('io').value, '貼り付け'); }

/* 読み込む前に «何が何に置きかわるのか» を1つずつ見せて、選ばせる。
   別の端末から «売上だけ» もらいたい場面があるため（まるごと入れると、
   こちらで棚卸したばかりの在庫まで置きかわってしまう）。 */
let BK = { box:null, from:'', pick:{} };
function bkRestore(text, from){
  const box = KemuriBackup.parse(text);
  if(!box){ toast('バックアップとして読めませんでした'); return; }
  BK.box = box; BK.from = from; BK.pick = {};
  /* 既定は «中身が増えるものだけ» 入れる。棚卸した在庫を黙って空にしないため。
     減るもの・消えるものは、こちらで選んでもらう。 */
  const now = KemuriBackup.current();
  KemuriBackup.summary(box).forEach(x=>{
    BK.pick[x.key] = !now[x.key] || !bkLooksSmaller(x.detail, now[x.key]);
  });
  drawBk();
}
/* 「22品目」「268日ぶん」のような一言から、先頭の数を取り出して比べる。
   厳密な比較ではないので «たぶん減る» を既定オフにするためだけに使う。 */
function bkNum(t){ const m = String(t||'').match(/(\d[\d,]*)/); return m ? +m[1].replace(/,/g,'') : null; }
function bkLooksSmaller(a, b){
  const x = bkNum(a), y = bkNum(b);
  return x != null && y != null && x < y;
}
function bkToggle(k){ BK.pick[k] = !BK.pick[k]; drawBk(); }
function drawBk(){
  const box = BK.box; if(!box) return;
  const now = KemuriBackup.current();
  const list = KemuriBackup.summary(box);
  const when = box.at ? fmtDT(box.at) : '日時不明';
  let h = '<h3>読み込むものを選ぶ</h3>'
        + '<div class="sh-sub">' + esc(BK.from) + '　' + esc(when) + '</div>';
  if(box.old) h += '<div class="warn" style="margin-bottom:12px">古い形式（在庫アプリのぶんだけ）のバックアップです。</div>';
  list.forEach(x=>{
    const on = !!BK.pick[x.key];
    const cur = now[x.key];
    const gone = cur && bkLooksSmaller(x.detail, cur);
    h += '<button class="bk-row' + (on?' on':'') + '" onclick="bkToggle(\''+x.key+'\')">'
       + '<span class="bk-ck">' + (on?'☑':'☐') + '</span>'
       + '<span class="bk-b"><b>' + esc(KemuriBackup.label(x.key)) + '</b>'
       + '<small>' + (cur ? 'いま ' + esc(cur) + ' → ' : 'いまは無し → ') + esc(x.detail) + '</small>'
       + (on && gone ? '<small class="bk-ng">いまのほうが多いので、減ります</small>' : '')
       + '</span></button>';
  });
  const n = Object.keys(BK.pick).filter(k=>BK.pick[k]).length;
  h += '<div class="muted gap">選ばなかったものは、いまのまま残ります。</div>'
     + '<div class="two"><button class="btn btn-gray" onclick="closeSheet()">やめる</button>'
     + '<button class="btn btn-primary" ' + (n?'':'disabled') + ' onclick="bkApply()">'
     + (n ? n + '件を読み込む' : '選んでください') + '</button></div>';
  openSheet(h);
}
function bkApply(){
  const box = BK.box; if(!box) return;
  const keys = Object.keys(BK.pick).filter(k=>BK.pick[k]);
  if(!keys.length) return;
  const res = KemuriBackup.apply(box, keys);
  closeSheet();
  if(!res.ok.length){ toast('読み込めませんでした'); return; }
  /* 在庫アプリぶんを読み直す。後から足した項目はここで埋まる */
  DB = migrate(Object.assign(blank(), JSON.parse(localStorage.getItem(LS_KEY) || '{}')));
  save();
  try{ KemuriCore.sales.reload && KemuriCore.sales.reload(); }catch(e){}
  render();
  if(res.ng.length){
    alert('一部が入りませんでした（' + res.ng.map(k=>KemuriBackup.label(k)).join('、') + '）。\n'
        + '端末の空き容量が足りない可能性があります。');
  }else{
    toast(res.ok.length + '件を読み込みました');
  }
}
function resetAll(){
  if(!confirm('在庫・履歴・対応表をすべて消して、最初の状態に戻しますか？')) return;
  localStorage.removeItem(LS_KEY); DB = load(); save(); render(); toast('最初の状態に戻しました');
}

/* ---------- シート ---------- */
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('ov').classList.add('show');
}
function closeSheet(){ document.getElementById('ov').classList.remove('show'); }

/* ---------- 取り込みボタンから直接受け取る ----------
   ブックマークレットが reitou.html#pos=<売上データ> を開くので、
   起動時にそれを読み取ってそのままプレビューまで進める。 */
function importFromHash(){
  if(window.__kemuriMoving) return false;   // 古いURLから新しいURLへ移る途中。ここでは読まない
  const m = String(location.hash||'').match(/[#&]pos=([^&]*)/);
  if(!m || !m[1]) return false;
  let text = '';
  try{ text = decodeURIComponent(m[1].replace(/\+/g,' ')); }catch(e){ return false; }
  history.replaceState(null, '', location.pathname + location.search);   // URLを元に戻す
  if(!text.trim()) return false;
  try{ startImport(CsvPosSource.fromText(text, 'POSから直接')); return true; }
  catch(e){ toast((e && e.userMsg) || '読み取れませんでした'); return false; }
}
window.addEventListener('hashchange', importFromHash);

/* コピーした内容をそのまま取り込む（貼り付けの手間をなくす） */
async function clipImport(){
  try{
    const t = await navigator.clipboard.readText();
    if(!t || !t.trim()){ toast('コピーされた内容がありません'); return; }
    startImport(CsvPosSource.fromText(t, 'コピーから取込'));
  }catch(e){
    toast((e && e.userMsg) || 'コピーを読めませんでした。下の枠に貼り付けてください');
  }
}

/* ---------- iPhone向けの細かい調整 ---------- */
function isField(el){ return el && el.matches && el.matches('input,select,textarea'); }
document.addEventListener('focusin', e=>{
  if(!isField(e.target)) return;
  document.getElementById('tabbar').classList.add('hide');       // キーボードに隠されないように
  if(e.target.inputMode==='numeric' || e.target.inputMode==='decimal') setTimeout(()=>{ try{ e.target.select(); }catch(err){} }, 0); // 打ち替えやすく全選択
});
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{ if(!isField(document.activeElement)) document.getElementById('tabbar').classList.remove('hide'); }, 120);
});

/* ---------- 起動 ---------- */
(function init(){
  DB.items.forEach(it=>{
    if(it.per==null) it.per = 1;
    if(it.min==null) it.min = 0;
    if(it.stock==null) it.stock = 0;
  });
  if(!DB.ordered) DB.ordered = {};
  if(!DB.supCfg) DB.supCfg = {};
  if(!Array.isArray(DB.orders)) DB.orders = [];
  if(!DB.applied) DB.applied = {};
  if(!DB.posSeeded){ applySeedPos(DB); DB.posSeeded = 1; }
  /* 「うまれば」→「馬レバ刺し」に名前変更、「鶏はらみ」を追加（すでに使っている端末ぶん） */
  if(!DB.mig2){
    const um = DB.items.find(i=>i.name==='うまれば');
    if(um) um.name = '馬レバ刺し';
    if(!DB.items.find(i=>i.name==='鶏はらみ')){
      const id = DB.seq++;
      DB.items.push({ id, name:'鶏はらみ', stock:0, min:3, per:1, cost:0 });   // 実在庫は棚卸で入れる
      DB.map[norm('鶏はらみ')] = { item:id, label:'鶏はらみ' };
    }
    applySeedPos(DB);
    DB.mig2 = 1;
  }
  /* 「軟骨唐揚げ」「ハツと砂肝の唐揚げ」を追加（すでに使っている端末ぶん） */
  if(!DB.mig3){
    ['軟骨唐揚げ','ハツと砂肝の唐揚げ'].forEach(name=>{
      if(DB.items.find(i=>i.name===name)) return;
      const id = DB.seq++;
      DB.items.push({ id, name, stock:0, min:3, per:1, cost:0 });   // 実在庫は棚卸で入れる
      DB.map[norm(name)] = { item:id, label:name };
    });
    applySeedPos(DB);
    DB.mig3 = 1;
  }
  migrate(DB);               // 上の追加ぶんにも、後から足した項目を埋める
  save();
  render();
  importFromHash();          // 取り込みボタンから開かれたときは、そのままプレビューへ
})();
</script>
