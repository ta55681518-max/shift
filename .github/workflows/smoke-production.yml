name: 本番の動作確認（GETのみ）

# 本番URLに対して「読むだけ」の確認をする。
# ⚠️ ページを操作しない・localStorage に書かない。本番データには一切触れない。
on:
  schedule:
    - cron: '0 22 * * *'      # 日本時間 朝7時
    - cron: '0 10 * * *'      # 日本時間 19時（開店前）
  workflow_dispatch:

concurrency:
  group: smoke-production
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  SITE: https://comfy-khapse-8a3cae.netlify.app

jobs:
  smoke:
    name: 本番が生きているか
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 各画面が 200 で返るか
        id: pages
        run: |
          set -uo pipefail
          FAIL=0
          for p in index.html dashboard.html reitou.html kushiyaki.html hacchu.html order.html \
                   kemuri-core.js kemuri-data.js kemuri-backup.js pos-source.js site-notice.js \
                   netlify.toml; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE}/${p}" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "  OK   ${p}"
            else
              echo "  NG   ${p} → HTTP ${CODE}"
              FAIL=1
            fi
          done
          echo "fail=${FAIL}" >> $GITHUB_OUTPUT
          [ "$FAIL" = "0" ]

      - name: 共通JSが本当に中身を返しているか
        run: |
          set -uo pipefail
          BODY=$(curl -s --max-time 20 "${SITE}/kemuri-core.js")
          echo "$BODY" | grep -q 'KemuriCore' || { echo "::error::kemuri-core.js の中身が違う"; exit 1; }
          echo "$BODY" | grep -q 'kemuri_sales_v1' || { echo "::error::売上履歴のキーが見つからない"; exit 1; }
          echo "  OK   kemuri-core.js に KemuriCore と kemuri_sales_v1 がある"

      - name: AIの窓口が «認証付きで» 生きているか
        run: |
          set -uo pipefail
          # 合言葉なしで POST → 401（または 500/setup）が返るのが正しい。
          # 200 が返ったら認証が外れているので異常。
          CODE=$(curl -s -o /tmp/ai.json -w '%{http_code}' --max-time 20 \
            -X POST "${SITE}/api/ai" \
            -H 'Content-Type: application/json' \
            -d '{"task":"ping"}' || echo 000)
          echo "  /api/ai → HTTP ${CODE}"
          case "$CODE" in
            401) echo "  OK   合言葉なしは拒否されている" ;;
            500) echo "  注意 サーバ側の環境変数が未設定の可能性（本文: $(head -c 200 /tmp/ai.json)）" ;;
            200) echo "::error::合言葉なしで通ってしまった（認証が外れている）"; exit 1 ;;
            404) echo "::error::/api/ai が見つからない（Functions が配備されていない）"; exit 1 ;;
            *)   echo "::warning::想定外の応答 ${CODE}" ;;
          esac

      - name: 版表示がリポジトリと一致しているか
        run: |
          set -uo pipefail
          LOCAL=$(grep -oE "BUILD:\s*'[^']+'" kemuri-data.js | grep -oE "'[^']+'" | tr -d "'")
          REMOTE=$(curl -s --max-time 20 "${SITE}/kemuri-data.js" | grep -oE "BUILD:\s*'[^']+'" | grep -oE "'[^']+'" | tr -d "'")
          echo "  リポジトリ: ${LOCAL} / 本番: ${REMOTE}"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::warning::本番がリポジトリと違う版です（デプロイ待ち、または切り戻し中）"
          fi

      - name: 結果をまとめる
        if: always()
        run: |
          echo "### 本番スモークテスト $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "- 対象: ${SITE}" >> $GITHUB_STEP_SUMMARY
          echo "- 結果: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: 異常なら通知
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 既存の通知が無ければ Issue を立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TITLE="🚨 本番が異常です"
          EXIST=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          本番サイトのスモークテストが失敗しました。

          - 対象: ${SITE}
          - ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 検出時刻: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') (JST)

          ## iPhone からの応急処置

          1. [Netlify のデプロイ一覧](https://app.netlify.com/projects/comfy-khapse-8a3cae/deploys) を開く
          2. **Stop auto publishing** を押す（以後 push しても本番は変わらなくなる）
          3. 直前の正常なデプロイを開き **Publish deploy** を押す（即時に切り戻る）

          ※ 切り戻してもオーナーの端末の localStorage のデータは変わりません。
             データがおかしくなっている場合は、アプリの ⚙️設定 → バックアップから復元してください。
          EOF
          )
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
