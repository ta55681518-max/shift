name: Codexレビュー指摘の修正を送信
on:
  push:
    branches: [codex/bot-pr-bootstrap-20261112]
permissions:
  contents: write
concurrency:
  group: bot-review-fix-publisher
  cancel-in-progress: false
jobs:
  publish:
    name: 検証済みの修正だけをBotから送信
    if: github.actor == 'ta55681518-max'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='ta55681518-max'||repo!=='shift'||context.actor!==owner||context.eventName!=='push'||context.ref!=='refs/heads/codex/bot-pr-bootstrap-20261112')throw Error('許可されていない実行です');
            const branch='bot/automation-safety-20261112-v2';
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!=='5fdc174589aac437683e67d8151dc6a0d006afeb')throw Error('PR側に別の変更があります');
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:'b3fe91c4554c00b3a44e54d509b41745f494cc20'});
            if(commit.data.tree.sha!=='7857d4a08d19e0dc0a1800e0aeea18d239ea6973'||commit.data.parents.length!==1||commit.data.parents[0].sha!==current.data.commit.sha)throw Error('検証した修正と一致しません');
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:'b3fe91c4554c00b3a44e54d509b41745f494cc20',force:false});
            core.info('検証済みの修正をBot名義でPR #61へ送信しました');