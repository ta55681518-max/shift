<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a1109">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音声メモ">
<link rel="apple-touch-icon" href="memo-icon-180.png">
<link rel="icon" type="image/png" href="memo-icon.png">
<link rel="manifest" href="memo.webmanifest">
<title>音声メモ - 串焼KEMURI屋</title>
<script src="site-notice.js?v=20261012b"></script>
<!--
  ============================================================
  音声メモ（memo.html）
  ・項目（カテゴリ）ごとに、声でメモを入れられる
  ・メモごとにリマインド（日時・くり返し）をかけられる
  ・入れた日付と曜日・時刻が自動でつく
  ・データはこの端末（ブラウザ×URL）の localStorage「kemuri_memo_v1」に保存
    → 機種変更・ブラウザ変更のときは「設定 → バックアップ書き出し」で持ち出す
  ・リマインドの通知は «このページ（またはホーム画面アプリ）が開いているあいだ» に鳴る。
  ・Xserver に xserver/memo-api を置いて「設定 → ほかのiPhoneと同期」で接続すると、
    どのiPhoneで書いても同じ内容になり、閉じていてもサーバーからプッシュ通知が届く
    （設置手順は xserver/memo-api/README.md）。
  ============================================================
-->
<style>
  :root{
    --bg:#1a1210; --card:#241813; --card2:#2e2019; --line:#3a2a22; --line2:#5a4438;
    --tx:#f5efe6; --sub:#b9a99c; --mute:#8a7a6e; --acc:#e8622a; --acc2:#ff7b3d; --gold:#ffcf9e;
    --red:#ff6b5b; --green:#3fb57a; --blue:#7db4ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx)}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#3a1c12,#2a1109);
    border-bottom:2px solid var(--acc);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .hrow{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .hrow h1{margin:0;font-size:18px;letter-spacing:1px;flex:1}
  .today{font-size:13px;color:var(--gold);font-weight:bold;text-align:right;line-height:1.3}
  .today small{display:block;color:var(--sub);font-weight:normal;font-size:11px}
  .iconbtn{background:#00000033;border:1px solid var(--line2);color:var(--tx);border-radius:10px;
    min-width:40px;height:40px;font-size:18px;position:relative}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;
    border-radius:10px;padding:1px 6px;font-weight:bold}
  .wrap{max-width:640px;margin:0 auto;padding:12px 16px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;max-width:640px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line2);background:var(--card2);
    color:var(--sub);font-size:14px;font-weight:bold;white-space:nowrap}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tab .n{font-size:11px;opacity:.8;margin-left:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .ttl{font-size:13px;color:var(--gold);font-weight:bold;margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .ttl .sp{flex:1}
  .muted{color:var(--mute);font-size:12px}
  /* 項目ごとの録音タイル */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .tile{border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 8px;color:var(--tx);
    display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:bold;min-height:84px;justify-content:center}
  .tile .e{font-size:24px}
  .tile .m{font-size:11px;color:var(--sub);font-weight:normal}
  .tile:active{transform:scale(.97)}
  /* 入力欄 */
  .catchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{padding:6px 10px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--sub);font-size:13px}
  .chip.on{color:#fff;border-color:transparent}
  textarea,input,select{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--line2);
    background:#160f0c;color:var(--tx);font-family:inherit}
  textarea{min-height:96px;resize:vertical;line-height:1.5}
  input[type=datetime-local]{min-height:46px}
  .interim{color:var(--mute);font-size:14px;min-height:20px;margin-top:4px;font-style:italic}
  .mic{width:100%;margin-top:10px;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:bold;
    background:linear-gradient(180deg,#ff7b3d,#e8541f);color:#fff;box-shadow:0 4px 0 #a83a12;letter-spacing:1px}
  .mic:active{transform:translateY(2px);box-shadow:0 2px 0 #a83a12}
  .mic.rec{background:linear-gradient(180deg,#e03b3b,#b51f1f);box-shadow:0 4px 0 #6e1010;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .btn{padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--gold);font-size:15px;font-weight:bold}
  .btn.pri{background:var(--green);border-color:var(--green);color:#fff}
  .btn.dan{color:var(--red)}
  .btn:disabled{opacity:.45}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick button{padding:7px 10px;border-radius:16px;border:1px solid var(--line2);background:#160f0c;color:var(--gold);font-size:12px}
  .quick button.on{background:var(--gold);color:#2a1109;border-color:var(--gold);font-weight:bold}
  .suggest{margin-top:8px;padding:8px 10px;border-radius:10px;background:#3b2a12;border:1px dashed var(--gold);font-size:13px;display:none}
  .suggest button{margin-left:6px;padding:4px 10px;border-radius:12px;border:none;background:var(--gold);color:#2a1109;font-weight:bold}
  .remsel{margin-top:8px;font-size:13px;color:var(--gold)}
  /* 絞り込み */
  .filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:0 0 auto;padding:6px 12px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--sub);font-size:13px}
  .filters button.on{background:var(--card2);color:var(--gold);border-color:var(--gold)}
  .search{margin-bottom:10px}
  /* 一覧 */
  .dayh{display:flex;align-items:baseline;gap:8px;margin:16px 2px 6px;font-weight:bold;font-size:14px;color:var(--gold)}
  .dayh .rel{font-size:11px;color:var(--sub);font-weight:normal}
  .dayh.sat{color:var(--blue)} .dayh.sun{color:#ff8a8a}
  .memo{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .memo.done{opacity:.55}
  .memo.done .txt{text-decoration:line-through}
  .memo.flash{animation:flash 1.6s 2}
  @keyframes flash{50%{background:#4a2a18}}
  .mhead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-bottom:4px;flex-wrap:wrap}
  .cbadge{padding:2px 8px;border-radius:10px;color:#fff;font-weight:bold;font-size:11px}
  .rbadge{padding:2px 8px;border-radius:10px;background:#3b2a12;color:var(--gold);font-size:11px}
  .rbadge.over{background:#5a1d18;color:#ffb3a8}
  .rbadge.soon{background:#4a3a10;color:#ffe08a}
  .pin{color:var(--gold)}
  .txt{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.55}
  .acts{display:grid;grid-template-columns:1.3fr 1.3fr 1.3fr 1fr 1fr 1fr 1fr;gap:4px;margin-top:8px}
  .acts button{min-width:0;white-space:nowrap;overflow:hidden;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:13px}
  .acts button.on{color:var(--green);border-color:var(--green)}
  .empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}
  /* 今日のリマインド */
  .duelist .it{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .duelist .it:last-child{border-bottom:none}
  .duelist .t{color:var(--gold);font-weight:bold;min-width:52px}
  .duelist .x{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* シート（モーダル） */
  .sheetbg{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:flex-end;justify-content:center}
  .sheetbg.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
    border-top:2px solid var(--acc);padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center}
  .sheet h2 .sp{flex:1}
  .field{margin-bottom:12px}
  .field>label{display:block;font-size:12px;color:var(--gold);font-weight:bold;margin-bottom:5px}
  .catrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .catrow input.emo{width:56px;flex:0 0 56px;text-align:center;padding:10px 4px}
  .catrow input.col{width:46px;flex:0 0 46px;padding:2px;height:44px}
  .catrow button{flex:0 0 auto;width:40px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--sub);font-size:15px}
  /* 鳴っているリマインド */
  .alarm{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:60;max-width:616px;margin:0 auto;
    background:#3b1a10;border:2px solid var(--acc2);border-radius:14px;padding:12px;box-shadow:0 8px 30px #000c;display:none}
  .alarm.show{display:block;animation:drop .3s}
  @keyframes drop{from{transform:translateY(-30px);opacity:0}}
  .alarm .at{font-size:12px;color:var(--gold);font-weight:bold}
  .alarm .ax{font-size:16px;margin:6px 0 10px;white-space:pre-wrap;max-height:30vh;overflow:auto}
  .alarm .row button{padding:10px 4px;font-size:13px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:#fff;
    padding:10px 16px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70;
    max-width:92%;display:flex;gap:10px;align-items:center}
  .toast.show{opacity:.95;pointer-events:auto}
  .toast button{background:none;border:none;color:var(--gold);font-weight:bold;font-size:14px}
  .fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:66px;height:66px;border-radius:50%;
    border:none;font-size:28px;color:#fff;background:linear-gradient(180deg,#ff7b3d,#e8541f);box-shadow:0 6px 18px #000a}
  .fab.rec{background:linear-gradient(180deg,#e03b3b,#b51f1f);animation:pulse 1.2s infinite}
  .note{font-size:12px;color:var(--sub);line-height:1.6;background:#160f0c;border-radius:10px;padding:10px;border:1px solid var(--line)}
  .warn{background:#3b1a10;border:1px solid var(--acc);color:#ffd7c2;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px;line-height:1.5}
  .nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:20px 0 8px}
  .nav a{font-size:12px;text-decoration:none;padding:6px 11px;border-radius:16px;background:var(--card2);color:var(--sub);border:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>🎤 音声メモ</h1>
    <div class="today" id="today"></div>
    <button class="iconbtn" id="bellBtn" title="リマインド一覧">🔔<span class="badge" id="bellBadge" style="display:none"></span></button>
    <button class="iconbtn" id="setBtn" title="設定">⚙</button>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div id="warnBox"></div>
  <div id="dueBox"></div>
  <div id="tilesBox"></div>

  <!-- 入力欄 -->
  <div class="card" id="composer">
    <div class="ttl">✏️ 新しいメモ<span class="sp"></span><span class="muted" id="nowStamp"></span></div>
    <div class="catchips" id="compCats"></div>
    <textarea id="compText" maxlength="100000" placeholder="下のマイクを押して話す／ここに打ってもOK"></textarea>
    <div class="interim" id="compInterim"></div>
    <div class="suggest" id="compSuggest"></div>
    <div class="quick" id="compQuick"></div>
    <div class="remsel" id="compRem"></div>
    <button class="mic" id="compMic">🎤 話して入力</button>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="compClear">クリア</button>
      <button class="btn pri" id="compSave">保存する</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <input class="search" id="search" type="search" placeholder="🔍 メモをさがす（例：鶏もも、業者）">
  <div id="list"></div>

  <div class="nav">
    <a href="dashboard.html">ホーム</a><a href="reitou.html">冷凍在庫</a><a href="kushiyaki.html">串焼き在庫</a><a href="hacchu.html">発注</a>
  </div>
  <div class="muted" style="text-align:center">串焼KEMURI屋 音声メモ v1</div>
</div>

<button class="fab" id="fab" title="すぐ録音">🎤</button>

<!-- 編集シート -->
<div class="sheetbg" id="editBg">
  <div class="sheet">
    <h2>メモを編集<span class="sp"></span><button class="iconbtn" data-close>✕</button></h2>
    <div class="muted" id="edStamp" style="margin-bottom:10px"></div>
    <div class="field"><label>項目</label><div class="catchips" id="edCats"></div></div>
    <div class="field"><label>内容</label>
      <textarea id="edText" maxlength="100000" style="min-height:140px"></textarea>
      <div class="interim" id="edInterim"></div>
      <button class="mic" id="edMic">🎤 話して追記</button>
    </div>
    <div class="field"><label>🔔 リマインド</label>
      <input type="datetime-local" id="edRem">
      <div class="quick" id="edQuick"></div>
      <div class="suggest" id="edSuggest"></div>
    </div>
    <div class="field"><label>くり返し</label>
      <select id="edRepeat">
        <option value="">しない</option>
        <option value="daily">毎日</option>
        <option value="weekdays">平日（月〜金）</option>
        <option value="weekly">毎週（同じ曜日）</option>
        <option value="monthly">毎月（同じ日）</option>
      </select>
    </div>
    <div class="field"><label>カレンダーにも入れる（アプリを閉じていても鳴る）</label>
      <div class="row"><button class="btn" id="edIcs">📅 カレンダー</button><button class="btn" id="edGcal">Googleカレンダー</button></div>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn dan" id="edDel">削除</button>
      <button class="btn pri" id="edSave">保存</button>
    </div>
  </div>
</div>

<!-- 設定シート -->
<div class="sheetbg" id="setBg">
  <div class="sheet">
    <h2>設定<span class="sp"></span><button class="iconbtn" data-close>✕</button></h2>
    <div class="field"><label>項目（カテゴリ）</label>
      <div id="catEdit"></div>
      <button class="btn" id="catAdd" style="width:100%;margin-top:4px">＋ 項目を追加</button>
      <div class="muted" style="margin-top:6px">項目を消すと、その項目のメモは「その他」に移ります（メモは消えません）。</div>
    </div>
    <div class="field"><label>☁ ほかのiPhoneと同期・サーバー通知（Xserver）</label>
      <input id="shUrl" type="url" placeholder="サーバーのURL（例：https://xxxx.xsrv.jp/memo-api/）" style="margin-bottom:6px" autocapitalize="off">
      <input id="shPass" type="password" placeholder="合言葉" style="margin-bottom:6px" autocomplete="current-password">
      <div class="row"><button class="btn" id="shConnect">接続する</button><button class="btn dan" id="shOff">同期をやめる</button></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="pushBtn">この端末で通知を受け取る</button><button class="btn" id="pushTest">サーバーから試す</button></div>
      <div class="note" id="shNote" style="margin-top:8px"></div>
    </div>
    <div class="field"><label>通知（この画面を開いているとき）</label>
      <div class="row"><button class="btn" id="notifBtn">通知をオンにする</button><button class="btn" id="testBtn">テストで鳴らす</button></div>
      <div class="note" id="notifNote" style="margin-top:8px"></div>
    </div>
    <div class="field"><label>音声入力</label>
      <label class="row" style="font-size:14px;color:var(--tx)"><input type="checkbox" id="optPunct" style="width:auto;flex:0 0 auto"> 「改行」「句点」「読点」と言うと、改行・。・、に変える</label>
      <label class="row" style="font-size:14px;color:var(--tx);margin-top:8px"><input type="checkbox" id="optAutoSave" style="width:auto;flex:0 0 auto"> 右下🎤の録音は、止めたらそのまま保存する</label>
      <label class="row" style="font-size:14px;color:var(--tx);margin-top:8px"><input type="checkbox" id="optSound" style="width:auto;flex:0 0 auto"> リマインドの時に音を鳴らす</label>
    </div>
    <div class="field"><label>バックアップ</label>
      <div class="row"><button class="btn" id="expBtn">書き出し</button><button class="btn" id="impBtn">読み込み</button></div>
      <input type="file" id="impFile" accept=".json,application/json" style="display:none">
      <button class="btn" id="txtBtn" style="width:100%;margin-top:8px">メモを文章でコピー（LINE・メール貼り付け用）</button>
      <div class="muted" style="margin-top:6px" id="dataInfo"></div>
    </div>
    <div class="note">
      ・ホーム画面に追加すると、アプリのように使えます（iPhone：共有ボタン→「ホーム画面に追加」）。<br>
      ・リマインドは、この画面を開いているあいだ通知・音で知らせます。<b>閉じていても知らせてほしい時は、上の「ほかのiPhoneと同期・サーバー通知」に接続</b>するか、メモの「📅カレンダー」を使ってください。<br>
      ・データはこの端末の中だけに保存されます。機種変更の前に「書き出し」をしておくと安心です。
    </div>
  </div>
</div>

<div class="alarm" id="alarm">
  <div class="at" id="alarmAt"></div>
  <div class="ax" id="alarmTx"></div>
  <div class="row">
    <button class="btn" data-snooze="10">10分後</button>
    <button class="btn" data-snooze="60">1時間後</button>
    <button class="btn" data-snooze="tomorrow">明日の朝</button>
    <button class="btn pri" id="alarmDone">完了</button>
  </div>
  <button class="btn" id="alarmClose" style="width:100%;margin-top:6px;font-size:13px;padding:8px">あとで（閉じる）</button>
</div>

<div class="toast" id="toast"><span id="toastTx"></span><button id="toastBtn" style="display:none"></button></div>

<script>
(function(){
'use strict';

/* ---------------- 保存まわり ---------------- */
var KEY = 'kemuri_memo_v1';
var WD = ['日','月','火','水','木','金','土'];
var DEFAULT_CATS = [
  {id:'c_shikomi', name:'仕込み', emoji:'🔪', color:'#d9622b'},
  {id:'c_hacchu',  name:'発注',   emoji:'📦', color:'#2f8f5b'},
  {id:'c_mise',    name:'店のこと', emoji:'🏮', color:'#b5403a'},
  {id:'c_staff',   name:'スタッフ', emoji:'👥', color:'#3d6fb5'},
  {id:'c_idea',    name:'新メニュー・アイデア', emoji:'💡', color:'#b58a12'},
  {id:'c_other',   name:'その他', emoji:'📝', color:'#7a6a5e'}
];
var db = load();
var SHARE_KEY = 'kemuri_memo_share_v1';
var share = (function(){
  var x = null; try{ x = JSON.parse(localStorage.getItem(SHARE_KEY) || 'null'); }catch(e){}
  x = x || {};
  if(!x.device) x.device = uid('d');
  return x;
})();
function saveShare(){ try{ localStorage.setItem(SHARE_KEY, JSON.stringify(share)); }catch(e){} }
saveShare();

function load(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  if(!d || typeof d !== 'object') d = {};

/* ---------------- 日付の表示 ---------------- */
function pad(n){ return (n<10?'0':'') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayDiff(a, b){ return Math.round((startOfDay(a) - startOfDay(b)) / 86400000); }
function fmtDay(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')'; }
function fmtShort(ms){
  var d = new Date(ms), now = new Date(), dd = dayDiff(d, now);
  var day = dd === 0 ? '今日' : dd === 1 ? '明日' : dd === -1 ? '昨日' : dd === 2 ? 'あさって'
          : (d.getMonth()+1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')';
  if(d.getFullYear() !== now.getFullYear()) day = d.getFullYear() + '/' + day;
  return day + ' ' + hm(d);
}
function relDay(d){
  var dd = dayDiff(new Date(), d);
  if(dd === 0) return '今日'; if(dd === 1) return '昨日'; if(dd === 2) return 'おととい';
  if(dd < 7) return dd + '日前'; if(dd < 31) return Math.floor(dd/7) + '週間前';
  if(dd < 365) return Math.floor(dd/30) + 'か月前'; return Math.floor(dd/365) + '年前';
}
function untilText(ms){
  var diff = ms - Date.now(), m = Math.round(Math.abs(diff)/60000);
  var s = m < 60 ? m + '分' : m < 1440 ? Math.floor(m/60) + '時間' + (m%60 ? (m%60) + '分' : '') : Math.floor(m/1440) + '日';
  return diff >= 0 ? 'あと' + s : s + '過ぎ';
}
function toLocalInput(ms){ if(!ms) return ''; var d = new Date(ms); return ymd(d) + 'T' + hm(d); }
function fromLocalInput(v){ if(!v) return null; var t = new Date(v).getTime(); return isNaN(t) ? null : t; }

function tickHeader(){
  var n = new Date();
  var cl = (typeof shareOn === 'function' && shareOn()) ? (share.err ? ' ⚠未同期' : ' ☁同期中') : '';
  $('today').innerHTML = n.getFullYear() + '年' + fmtDay(n) + '<small>' + hm(n) + cl + '</small>';
  $('nowStamp').textContent = '入力日：' + fmtDay(n) + ' ' + hm(n);
}

/* ---------------- 話し言葉から日時を読み取る ----------------
   例）「明日の10時に業者に電話」「金曜の15時半」「30分後」「午後3時」 */
function kanjiNum(s){
  return s.replace(/[〇一二三四五六七八九十]+/g, function(k){
    var map = {'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
    if(k.indexOf('十') < 0){ var v=''; for(var i=0;i<k.length;i++) v += map[k[i]]; return v; }
    var p = k.split('十'); return String((p[0] ? map[p[0]] : 1) * 10 + (p[1] ? map[p[1]] : 0));
  }).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
}
function parseWhen(raw){
  if(!raw) return null;
  var s = kanjiNum(raw), now = new Date(), m;
  if((m = s.match(/(\d+)\s*分後/))) return now.getTime() + (+m[1]) * 60000;
  if((m = s.match(/(\d+)\s*時間(半)?後/))) return now.getTime() + (+m[1]) * 3600000 + (m[2] ? 1800000 : 0);
  var day = null, hasDay = false, sameDay = false;
  if(/明後日|あさって/.test(s)){ day = 2; hasDay = true; }
  else if(/明日|あした|あす/.test(s)){ day = 1; hasDay = true; }
  else if(/今日|きょう|今夜|今晩/.test(s)){ day = 0; hasDay = true; }
  else if((m = s.match(/(\d+)\s*日後/))){ day = +m[1]; hasDay = true; }
  var target = new Date(now);
  if((m = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/))){
    target = new Date(now.getFullYear(), +m[1]-1, +m[2]);
    if(target < startOfDay(now)) target.setFullYear(target.getFullYear()+1);
    hasDay = true; day = null;
  } else if((m = s.match(/(来週|再来週)?\s*の?\s*([月火水木金土日])曜/))){
    var w = WD.indexOf(m[2]), add = (w - now.getDay() + 7) % 7;
    if(m[1] === '来週'){ add = (w === 0 ? 7 : w) - (now.getDay() === 0 ? 7 : now.getDay()) + 7; }
    else if(m[1] === '再来週'){ add = (w === 0 ? 7 : w) - (now.getDay() === 0 ? 7 : now.getDay()) + 14; }
    sameDay = !m[1] && add === 0;
    target.setDate(now.getDate() + add); hasDay = true; day = null;
  }
  if(day !== null) target.setDate(now.getDate() + day);
  var h = null, mi = 0;
  if((m = s.match(/(午前|午後|朝|昼|夕方|夜|晩)?\s*(\d{1,2})\s*時\s*(半|(\d{1,2})\s*分)?/))){
    h = +m[2]; mi = m[3] === '半' ? 30 : (m[4] ? +m[4] : 0);
    if(/午後|夕方|夜|晩/.test(m[1] || '') && h < 12) h += 12;
    else if(m[1] === '昼' && h < 6) h += 12;
  } else if((m = s.match(/(\d{1,2}):(\d{2})/))){ h = +m[1]; mi = +m[2]; }
  else if(/今夜|今晩/.test(s)){ h = 21; }
  if(h === null && !hasDay) return null;
  if(h === null){ h = 9; mi = 0; }
  if(h > 23 || mi > 59) return null;
  target.setHours(h, mi, 0, 0);
  if(!hasDay && target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
  if(sameDay && target.getTime() <= now.getTime()) target.setDate(target.getDate() + 7);
  if(target.getTime() <= now.getTime()) return null;
  return target.getTime();
}

/* ---------------- リマインドのくり返し ---------------- */
function nextRepeat(ms, rep){
  var d = new Date(ms), now = Date.now(), guard = 0;
  do{
    if(rep === 'daily') d.setDate(d.getDate()+1);
    else if(rep === 'weekdays'){ do{ d.setDate(d.getDate()+1); }while(d.getDay() === 0 || d.getDay() === 6); }
    else if(rep === 'weekly') d.setDate(d.getDate()+7);
    else if(rep === 'monthly') d.setMonth(d.getMonth()+1);
    else return null;
  }while(d.getTime() <= now && ++guard < 1000);
  return d.getTime();
}
var REP_LABEL = {daily:'毎日', weekdays:'平日', weekly:'毎週', monthly:'毎月'};

function quickTimes(){
  var n = new Date(), out = [];
  out.push(['30分後', n.getTime() + 30*60000]);
  out.push(['1時間後', n.getTime() + 3600000]);
  var t = new Date(n); t.setHours(17,0,0,0); if(t > n) out.push(['今日17時（仕込み）', t.getTime()]);
  t = new Date(n); t.setHours(21,0,0,0); if(t > n) out.push(['今夜21時', t.getTime()]);
  t = new Date(n); t.setDate(t.getDate()+1); t.setHours(9,0,0,0); out.push(['明日9時', t.getTime()]);
  t = new Date(n); t.setDate(t.getDate()+1); t.setHours(15,0,0,0); out.push(['明日15時', t.getTime()]);
  t = new Date(n); var add = (8 - t.getDay()) % 7 || 7; t.setDate(t.getDate()+add); t.setHours(10,0,0,0); out.push(['来週月曜10時', t.getTime()]);
  return out;
}

/* ---------------- 音声入力 ---------------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var voice = null;   // {ta, interimEl, btn, base, want, rec, onStop, label}
function punct(t){
  if(!db.opt.punct) return t;
  return t.replace(/\s*改行\s*/g, '\n').replace(/\s*句点\s*/g, '。').replace(/\s*読点\s*/g, '、');
}
function startVoice(ta, interimEl, btn, onStop, onText){
  if(!SR){
    toast('この端末のブラウザは音声入力に未対応です。キーボードのマイクボタンで話してください');
    ta.focus(); return;
  }
  if(voice){ var same = voice.ta === ta; stopVoice(); if(same) return; }
  var rec = new SR();
  rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
  var base = ta.value;
  if(base && !/[\s\n]$/.test(base)) base += '\n';
  voice = {ta:ta, interimEl:interimEl, btn:btn, base:base, want:true, rec:rec, onStop:onStop, finals:'', onText:onText};
  setRecUI(true);
  rec.onresult = function(e){
    var interim = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      var r = e.results[i];
      if(r.isFinal) voice.finals += punct(r[0].transcript);
      else interim += r[0].transcript;
    }
    ta.value = voice.base + voice.finals;
    interimEl.textContent = interim ? '…' + interim : '';
    if(voice.onText) voice.onText(ta.value);
  };
  rec.onerror = function(e){
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      toast('マイクが許可されていません。ブラウザの設定でマイクを許可してください');
      if(voice) voice.want = false;
    } else if(e.error === 'no-speech'){ /* 黙っていただけ。続ける */ }
    else if(e.error !== 'aborted') toast('音声入力エラー：' + e.error);
  };
  rec.onend = function(){
    // iPhone などは数秒で止まるので、止めるボタンを押すまで続ける
    if(voice && voice.rec === rec && voice.want){
      voice.base = ta.value; voice.finals = '';
      try{ rec.start(); return; }catch(err){}
    }
    if(voice && voice.rec === rec) finishVoice();
  };
  try{ rec.start(); }catch(err){ toast('音声入力を開始できませんでした'); finishVoice(); }
}
function stopVoice(){
  if(!voice) return;
  voice.want = false;
  try{ voice.rec.stop(); }catch(e){}
  // onend が来ない端末向けの保険
  var v = voice; setTimeout(function(){ if(voice === v) finishVoice(); }, 1200);
}
function finishVoice(){
  if(!voice) return;
  var v = voice; voice = null;
  v.interimEl.textContent = '';
  setRecUI(false, v);
  if(v.onStop) v.onStop(v.ta.value);
}
function setRecUI(on, v){
  v = v || voice;
  if(v && v.btn){
    v.btn.classList.toggle('rec', on);
    if(v.btn.id === 'fab') v.btn.textContent = on ? '■' : '🎤';
    else v.btn.textContent = on ? '■ 止める（話し終わったら押す）' : (v.btn.id === 'edMic' ? '🎤 話して追記' : '🎤 話して入力');
  }
  if(on && navigator.vibrate) navigator.vibrate(40);
}

function addMemo(text, cat, remind, repeat, byVoice){

  if(!text) return null;

/* カレンダー（.ics）：アプリを閉じていても端末のカレンダーが知らせてくれる */
function icsDate(ms){ var d = new Date(ms); return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g, function(c){ return '\\' + c; }); }
function currentEditForCal(){
  var t = $('edText').value.trim(), r = fromLocalInput($('edRem').value), k = catOf(ui.edCat);
  if(!r){ toast('先にリマインドの日時を入れてください'); return null; }
  return {title:k.emoji + ' ' + firstLine(t).slice(0,40), text:t, start:r, rep:$('edRepeat').value, cat:k.name};
}
function downloadIcs(){
  var c = currentEditForCal(); if(!c) return;
  var rr = {daily:'FREQ=DAILY', weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly:'FREQ=WEEKLY', monthly:'FREQ=MONTHLY'}[c.rep];
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KEMURI//memo//JA','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:' + ui.editId + '@kemuri-memo','DTSTAMP:' + icsDate(Date.now()),'DTSTART:' + icsDate(c.start),'DTEND:' + icsDate(c.start + 15*60000),
    'SUMMARY:' + icsEsc(c.title),'DESCRIPTION:' + icsEsc('【' + c.cat + '】\n' + c.text)];
  if(rr) lines.push('RRULE:' + rr);
  lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:' + icsEsc(c.title),'TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR');
  var blob = new Blob([lines.join('\r\n')], {type:'text/calendar;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'memo-reminder.ics';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  toast('カレンダー用ファイルを開きます。「追加」を押してください');
}
function openGcal(){
  var c = currentEditForCal(); if(!c) return;
  var rr = {daily:'RRULE:FREQ=DAILY', weekdays:'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly:'RRULE:FREQ=WEEKLY', monthly:'RRULE:FREQ=MONTHLY'}[c.rep];
  var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(c.title)
    + '&dates=' + icsDate(c.start) + '/' + icsDate(c.start + 15*60000)
    + '&details=' + encodeURIComponent('【' + c.cat + '】\n' + c.text) + (rr ? '&recur=' + encodeURIComponent(rr) : '');
  window.open(url, '_blank');
}

var swReg = null;
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('memo-sw.js', {scope:'./memo.html'}).then(function(r){ swReg = r; }).catch(function(){});
  navigator.serviceWorker.addEventListener('message', function(e){
    if(e.data && e.data.type === 'open-memo') jumpTo(e.data.id);
  });
}
function ensureNotifPermission(){
  if(!('Notification' in window) || Notification.permission !== 'default') return;
  try{
    var p = Notification.requestPermission(function(){ renderSettings(); });
    if(p && p.then) p.then(function(){ renderSettings(); });
  }catch(e){}
}
function osNotify(title, body, id){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  var opt = {body:body, icon:'memo-icon.png', badge:'memo-icon.png', tag:'memo-' + id, data:{id:id}, requireInteraction:true, vibrate:[200,100,200]};
  if(swReg && swReg.showNotification){ swReg.showNotification(title, opt).catch(function(){ try{ new Notification(title, opt); }catch(e){} }); }
  else { try{ var n = new Notification(title, opt); n.onclick = function(){ window.focus(); jumpTo(id); n.close(); }; }catch(e){} }
}
var audioCtx = null;
function beep(){
  if(!db.opt.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var t = audioCtx.currentTime;
    [0, .25, .5].forEach(function(o, i){
      var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(.0001, t+o); g.gain.exponentialRampToValueAtTime(.3, t+o+.02); g.gain.exponentialRampToValueAtTime(.0001, t+o+.2);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(t+o); osc.stop(t+o+.22);
    });
  }catch(e){}
  try{ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([300,150,300]); }catch(e){}
}
// 音はユーザー操作のあとでないと鳴らない端末があるので、最初のタップで準備しておく
document.addEventListener('pointerdown', function unlock(){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){}
  document.removeEventListener('pointerdown', unlock);
}, {once:false});

var alarmQueue = [], alarmCur = null;
var ALARMED = 'kemuri_memo_alarmed_v1';
function checkReminders(){
  var now = Date.now(), changed = false;
  if(shareOn()){
    // 共有中：くり返しを進める・済みにするのはサーバー（cron）。ここでは画面に出すだけ
    var al = {}; try{ al = JSON.parse(localStorage.getItem(ALARMED) || '{}') || {}; }catch(e){}
    db.memos.forEach(function(m){
      if(m.done || !m.remind || m.notified || m.remind > now) return;
      if(al[m.id] === m.remind) return;
      al[m.id] = m.remind;
      if(!share.push){ var k = catOf(m.cat); osNotify('🔔 ' + k.emoji + ' ' + k.name, firstLine(m.text), m.id); }
      alarmQueue.push({id:m.id, at:m.remind}); changed = true;
    });
    if(changed){
      var ids = {}; db.memos.forEach(function(m){ ids[m.id] = 1; });
      Object.keys(al).forEach(function(id){ if(!ids[id]) delete al[id]; });
      try{ localStorage.setItem(ALARMED, JSON.stringify(al)); }catch(e){}
      beep(); renderAll(); showNextAlarm();
    }
    return;
  }
  db.memos.forEach(function(m){
    if(m.done || !m.remind || m.notified || m.remind > now) return;
    var k = catOf(m.cat), late = now - m.remind > 5*60000;
    osNotify('🔔 ' + k.emoji + ' ' + k.name + (late ? '（' + fmtShort(m.remind) + ' のぶん）' : ''), firstLine(m.text), m.id);
    alarmQueue.push({id:m.id, at:m.remind});
    if(m.repeat && m.resume){ m.remind = m.resume; delete m.resume; m.notified = false; }
    else if(m.repeat){ m.remind = nextRepeat(m.remind, m.repeat); m.notified = false; }
    else m.notified = true;
    changed = true;
  });
  if(changed){ save(); beep(); renderAll(); showNextAlarm(); }
}
function showNextAlarm(){
  if(alarmCur) return;
  var a = alarmQueue.shift(); if(!a) return;
  var m = getMemo(a.id); if(!m){ showNextAlarm(); return; }
  alarmCur = a.id;
  var k = catOf(m.cat);
  $('alarmAt').textContent = '🔔 ' + k.emoji + ' ' + k.name + '　' + fmtShort(a.at) + ' のリマインド' + (alarmQueue.length ? '（ほか' + alarmQueue.length + '件）' : '');
  $('alarmTx').textContent = m.text;
  $('alarm').classList.add('show');
}
function closeAlarm(){ $('alarm').classList.remove('show'); alarmCur = null; setTimeout(showNextAlarm, 300); }
function snooze(m, v){
  var t;
  if(v === 'tomorrow'){ var d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); t = d.getTime(); }
  else t = Date.now() + (+v) * 60000;
  if(m.repeat){
    // くり返しのメモは、ふだんの予定（resume）を覚えておき、スヌーズが鳴ったらそこへ戻す
    var regular = m.resume || m.remind;
    if(t < regular){ m.resume = regular; m.remind = t; }
  } else m.remind = t;
  m.notified = false; m.updated = Date.now();
  save(); renderAll(); toast(fmtShort(t) + ' にもう一度知らせます');
}

/* ============================================================
   ほかのiPhoneとの同期・サーバー通知（Xserver の memo-api と話す）
   ・メモは «前回サーバーと揃えた形» と比べて、変わったものだけ送る
   ・同じメモを2台で直したら、あとから送ったほうが残る
   ・通知はサーバーの cron が毎分見て、Web Push でiPhoneに送る
   ============================================================ */
function shareOn(){ return !!(share.url && share.pass); }
function apiUrl(action, base){
  var u = String(base || share.url || '').trim();
  if(!/\.php($|\?)/.test(u)){ if(u.slice(-1) !== '/') u += '/'; u += 'api.php'; }
  return u + (u.indexOf('?') < 0 ? '?' : '&') + 'a=' + action;
}
function api(action, payload, cred){
  cred = cred || share;
  var body = Object.assign({pass:cred.pass, device:share.device, name:cred.name || share.name || ''}, payload || {});
  // text/plain にすると «事前確認(CORS preflight)» が要らず、Xserver でも素直に通る
  return fetch(apiUrl(action, cred.url), {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(body), cache:'no-store'})
    .then(function(r){
      return r.text().then(function(t){
        var j = null; try{ j = JSON.parse(t); }catch(e){}
        if(!j){ throw new Error(r.status === 403 ? 'サーバーに断られました(403)。XserverのWAF設定を確認' : r.status === 404 ? 'URLが見つかりません(404)' : 'サーバーの返事が読めません(HTTP ' + r.status + ')'); }
        if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
}

var syncing = false, syncAgain = false, syncTimer = null;
function scheduleSync(){ if(!shareOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 1200); }
function doSync(){
  if(!shareOn()) return Promise.resolve();
  if(syncing){ syncAgain = true; return Promise.resolve(); }
  syncing = true;
  var last = share.lastSynced || {}, now = Date.now(), out = [], sent = {}, here = {};
  db.memos.forEach(function(m){
    here[m.id] = 1;
    if(JSON.stringify(m) !== last[m.id]){ m.rev = now; sent[m.id] = JSON.stringify(m); out.push(JSON.parse(sent[m.id])); }
  });
  Object.keys(last).forEach(function(id){ if(!here[id]){ out.push({id:id, deleted:true, rev:now}); sent[id] = '__del'; } });
  var catsJ = JSON.stringify(db.cats), payload = {memos:out};
  if(catsJ !== share.catsJson){ payload.cats = db.cats; payload.catsRev = now; }
  var before = JSON.stringify(db);
  return api('sync', payload).then(function(res){
    var keep = {}, nowIds = {};
    db.memos.forEach(function(m){
      nowIds[m.id] = 1;
      var j = JSON.stringify(m);
      if(j !== sent[m.id] && j !== last[m.id]) keep[m.id] = m;      // 送っている間に直された／増えたメモ
    });
    var rejected = res.rejected || [];
    db.memos.forEach(function(m){ if(rejected.indexOf(m.id) >= 0) keep[m.id] = m; });   // サーバーに断られた（長すぎる）→ 原文を残す
    var newLast = {}, list = [], seen = {};
    (res.memos || []).forEach(function(sm){
      if(sm.deleted) return;
      newLast[sm.id] = JSON.stringify(sm);
      if(keep[sm.id]) return;
      var knew = (last[sm.id] !== undefined || sent[sm.id] !== undefined) && sent[sm.id] !== '__del';
      if(knew && !nowIds[sm.id]) return;                               // 送っている間に消されたメモ
      list.push(sm); seen[sm.id] = 1;
    });
    Object.keys(keep).forEach(function(id){ list.push(keep[id]); });
    db.memos = list;
    if(res.cats && res.cats.length){
      if(JSON.stringify(db.cats) === catsJ) db.cats = res.cats;
      share.catsJson = JSON.stringify(res.cats);
    }
    share.lastSynced = newLast; share.lastOk = Date.now(); share.people = res.people || [];
    share.err = rejected.length ? '長すぎるメモ ' + rejected.length + '件は同期されていません（' + (res.textMax || 100000) + '文字まで）。この端末には残っています' : '';
    saveShare();
    applyingRemote = true; save(); applyingRemote = false;
    if(JSON.stringify(db) !== before) renderAll(); else tickHeader();
    checkReminders();
  }).catch(function(e){
    share.err = e.message || String(e); saveShare(); tickHeader();
  }).then(function(){
    syncing = false; renderShareSettings();
    if(syncAgain){ syncAgain = false; setTimeout(doSync, 300); }
  });
}
setInterval(function(){ if(!document.hidden && shareOn()) doSync(); }, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && shareOn()) doSync(); });

function renderShareSettings(){
  if(!$('shUrl')) return;
  if(document.activeElement !== $('shUrl')) $('shUrl').value = share.url || share.draftUrl || '';
  $('shPass').placeholder = shareOn() ? '（接続済み・変えるときだけ入力）' : '合言葉';
  $('shOff').disabled = !shareOn();
  $('pushBtn').textContent = share.push ? '通知を受け取らない' : 'この端末で通知を受け取る';
  $('pushBtn').disabled = !shareOn(); $('pushTest').disabled = !share.push;
  var h;
  if(!shareOn()) h = 'Xserverに置いた「memo-api」のURLと合言葉を入れると、どのiPhoneで書いても・直しても同じ内容になり、アプリを閉じていてもリマインドが届きます。ほかのiPhoneでも同じURLと合言葉を入れてください。';
  else {
    h = (share.err ? '⚠ 同期できていません：' + esc(share.err) : '✅ 同期中' + (share.lastOk ? '（最終同期 ' + hm(new Date(share.lastOk)) + '）' : ''));
    h += '<br>通知：' + (share.push ? '🔔 この端末はサーバーから受け取ります' : '🔕 この端末はまだ受け取っていません');
    if(share.people && share.people.length) h += '<br>通知を受け取る端末：' + share.people.length + '台';
    if(isIOS() && !isStandalone()) h += '<br><b>iPhoneは、Safariの共有ボタン →「ホーム画面に追加」→ ホーム画面のアイコンから開くと通知を受け取れます。</b>';
  }
  $('shNote').innerHTML = h;
}
function isIOS(){ return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); }

$('shConnect').addEventListener('click', function(){
  var url = $('shUrl').value.trim(), pass = $('shPass').value || (shareOn() ? share.pass : ''), name = deviceName();
  if(!/^https?:\/\//.test(url)){ toast('サーバーのURLを https:// から入れてください'); return; }
  if(!pass){ toast('合言葉を入れてください'); return; }
  var first = !shareOn();
  var mine = db.memos.length;
  if(first && mine && !confirm('この端末のメモ ' + mine + '件もサーバーに入れて、ほかのiPhoneと同じ内容にします。\n項目はサーバー（ほかのiPhone）の項目に合わせ、この端末で自分で作った項目はそこに足します。よろしいですか？')) return;
  var btn = this; btn.disabled = true; btn.textContent = '接続中…';
  api('sync', {memos:[]}, {url:url, pass:pass, name:name}).then(function(res){
    share.url = url; share.pass = pass; share.name = name; share.err = '';
    if(first){
      share.lastSynced = {};
      if(res.catsRev > 0 && res.cats && res.cats.length){
        // サーバーに項目があれば、それを基準にする。初期の項目は送らず、自分で作った項目だけ足す
        var have = {}, def = {};
        res.cats.forEach(function(c){ have[c.id] = 1; });
        DEFAULT_CATS.forEach(function(c){ def[c.id] = 1; });
        var extra = db.cats.filter(function(c){ return !have[c.id] && !def[c.id]; });
        db.cats = res.cats.concat(extra);
        share.catsJson = JSON.stringify(res.cats);        // extra があるときだけ «変更» として送られる
      } else share.catsJson = '';                          // サーバーが空 → この端末の項目を入れる
    }
    db.memos.forEach(function(m){ if(!m.owner) m.owner = share.device; });
    applyingRemote = true; save(); applyingRemote = false;
    saveShare(); $('shPass').value = '';
    return doSync();
  }).then(function(){
    toast('接続しました。次は「この端末で通知を受け取る」を押してください');
  }).catch(function(e){ toast('接続できません：' + e.message); })
  .then(function(){ btn.disabled = false; btn.textContent = '接続する'; renderShareSettings(); renderAll(); });
});
$('shOff').addEventListener('click', function(){
  if(!confirm('同期をやめますか？\nこの端末のメモは残ります（サーバーのメモも消えません）。')) return;
  disablePush(true);
  share.url = ''; share.pass = ''; share.lastSynced = {}; share.catsJson = ''; share.err = ''; share.people = [];
  saveShare(); renderShareSettings(); renderAll(); toast('同期をやめました');
});
// 端末の見分け用（サーバーの記録に残すだけ。画面には出さない）
function deviceName(){
  var u = navigator.userAgent;
  return /iPad/.test(u) ? 'iPad' : /iPhone/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '端末';
}

function b64uToU8(s){
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '=';
  var r = atob(s), a = new Uint8Array(r.length); for(var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a;
}
function getReg(){
  if(swReg) return Promise.resolve(swReg);
  return navigator.serviceWorker.register('memo-sw.js', {scope:'./memo.html'}).then(function(r){ swReg = r; return r; });
}
function waitActive(reg){
  if(reg.active) return Promise.resolve(reg);
  return new Promise(function(res){
    var w = reg.installing || reg.waiting;
    if(!w){ res(reg); return; }
    w.addEventListener('statechange', function(){ if(w.state === 'activated') res(reg); });
    setTimeout(function(){ res(reg); }, 8000);
  });
}
function sameKey(sub, key){
  try{
    var k = sub.options && sub.options.applicationServerKey; if(!k) return true;
    var a = new Uint8Array(k), b = b64uToU8(key); if(a.length !== b.length) return false;
    for(var i = 0; i < a.length; i++) if(a[i] !== b[i]) return false; return true;
  }catch(e){ return true; }
}
function subscribePush(silent){
  var reg;
  return getReg().then(waitActive).then(function(r){ reg = r; return api('info'); }).then(function(info){
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub && !sameKey(sub, info.vapid)) return sub.unsubscribe().then(function(){ return null; });
      return sub;
    }).then(function(sub){
      if(sub) return sub;
      if(silent) return null;
      return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uToU8(info.vapid)});
    });
  }).then(function(sub){
    if(!sub){ share.push = false; saveShare(); return false; }
    return api('subscribe', {sub:sub.toJSON()}).then(function(){ share.push = true; saveShare(); return true; });
  });
}
function enablePush(){
  if(!shareOn()){ toast('先にサーバーに接続してください'); return; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
    if(isIOS() && !isStandalone()) alert('iPhoneで通知を受け取るには：\n① Safariの共有ボタン →「ホーム画面に追加」\n② ホーム画面の「音声メモ」アイコンから開く\n③ もう一度このボタンを押す\n（iOS 16.4以上が必要です）');
    else toast('このブラウザはプッシュ通知に対応していません');
    return;
  }
  var p = Notification.requestPermission();
  (p && p.then ? p : Promise.resolve(Notification.permission)).then(function(perm){
    if(perm !== 'granted'){ toast('通知が許可されませんでした。端末の設定から「音声メモ」の通知を許可してください'); return; }
    toast('通知を登録しています…');
    return subscribePush(false).then(function(ok){ toast(ok ? '🔔 この端末で通知を受け取ります' : '登録できませんでした'); });
  }).catch(function(e){ toast('通知の登録に失敗：' + e.message); })
  .then(function(){ renderShareSettings(); });
}
function disablePush(quiet){
  var was = share.push; share.push = false; saveShare();
  if(was && shareOn()) api('unsubscribe').catch(function(){});
  if(swReg && swReg.pushManager) swReg.pushManager.getSubscription().then(function(s){ if(s) s.unsubscribe(); }).catch(function(){});
  if(!quiet) toast('この端末への通知をやめました');
  renderShareSettings();
}
$('pushBtn').addEventListener('click', function(){ if(share.push) disablePush(); else enablePush(); });
$('pushTest').addEventListener('click', function(){
  api('testpush').then(function(r){
    var ok = (r.codes || []).some(function(c){ return c >= 200 && c < 300; });
    toast(ok ? '送りました。数秒で通知が届きます' : '送れませんでした（' + (r.codes || []).join(',') + '）。通知を登録し直してください');
  }).catch(function(e){ toast('送れません：' + e.message); });
});

renderAll();
checkReminders();
if(shareOn()){
  doSync();
  if(share.push && 'Notification' in window && Notification.permission === 'granted' && 'serviceWorker' in navigator){
    setTimeout(function(){ subscribePush(true).catch(function(){}); }, 1500);   // 登録を新しく保つ
  }
}
var hm0 = location.hash.match(/memo=([^&]+)/);
if(hm0){ setTimeout(function(){ jumpTo(decodeURIComponent(hm0[1])); }, 200); history.replaceState(null, '', location.pathname); }

window.KemuriMemo = {parseWhen:parseWhen, nextRepeat:nextRepeat, db:function(){ return db; }};
})();
